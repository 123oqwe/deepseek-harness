schemaVersion: "1.1"
status: "PROPOSED_PENDING_MAINTAINER"
note: "Binding only when maintainers approve and sign manifest v1.1; until then affected rows are BLOCKED and implementers may not tune a threshold to make a test pass."
thresholds:
  - epic: "P0-01"
    proposal: "Canonical hash excludes OS name and path spelling; JSON keys sorted, UTF-8 NFC, LF, POSIX relative paths, no timestamps. Node/pnpm/platform versions are signed metadata and must match the declared toolchain profile."
  - epic: "P1-06"
    proposal: "Reference Linux, 4 KiB no-op authenticated RPC, 10,000 samples: p95 ≤ 10 ms; process crash detection ≤ 2 s; process/RPC leak count after unload = 0."
  - epic: "P2-08"
    proposal: "Any new action after revocation rejects immediately; an already prepared action rechecks epoch at the next PEP; propagation upper bound ≤ 1 s."
  - epic: "P3-10"
    proposal: "Provider receipt versus external meter CPU/network/cost difference ≤ 5%; hard-limit overshoot ≤ one sampling period and creates no new action."
  - epic: "P4-07"
    proposal: "Lease uses storage-side monotonic time; client wall clock does not participate in correctness. After a newer token commits, successful writes by the expired owner = 0."
  - epic: "P5-03"
    proposal: "Official tokenizers use exact counts; other models have p95 relative estimate error ≤ 15%, and budget admission uses an upper bound when exceeded."
  - epic: "P5-07 / P5-08 / P5-09"
    proposal: "Cancel command acknowledgement ≤ 2 s and provider termination receipt ≤ 5 s; a provider without hard cancel reports `cancel_requested`, never `cancelled`."
  - epic: "P5-10"
    proposal: "Delegation converges ≤ 30 s after network recovery; until then its state is explicitly `pending` or `ambiguous`."
  - epic: "P5-12"
    proposal: "In the 50-agent fixture no lock wait exceeds 30 s, the complete scenario is ≤ 10 min, and worktree/process/lease count at the end = 0."
  - epic: "P6-03"
    proposal: "Q1 forget/erase propagation through primary store/index/cache ≤ 60 s; backup handling belongs to the P6-10 governance job and every residue has tombstone/evidence."
  - epic: "P6-10"
    proposal: "Q1 full-data erase job ≤ 60 s; production default SLA ≤ 24 h; legal-hold residue is enumerated, never reported deleted."
  - epic: "P7-10"
    proposal: "Any hard invariant failure rolls back immediately; quality decline > 2 percentage points or p95 latency/cost increase > 20% triggers rollback, fixed n ≥ 100."
  - epic: "P8-02"
    proposal: "At 100,000 resources, first page p95 ≤ 500 ms, delta p95 ≤ 250 ms, and per-client buffer is bounded at ≤ 16 MiB."
  - epic: "P8-05"
    proposal: "A 10,000-event reconnect projection has p95 ≤ 1 s; retention is governed only by policy and never by silent shifting."
  - epic: "P8-08"
    proposal: "Reference browser first operable run view p95 ≤ 2 s, local control feedback p95 ≤ 100 ms, and stream data loss = 0."
  - epic: "P8-10"
    proposal: "Q2 RPO = zero acknowledged canonical records; cold-restore RTO ≤ 5 min."
  - epic: "Real-model claims"
    proposal: "Fixed provider/model/profile/dataset, n = 100 nightly, one-sided 95% Wilson lower bound ≥ 95% for three consecutive nights; hard-safety success remains 100%."
