        stage: "U"
        declaredPath: "scripts/architecture/check-layer-deps.mjs"
        approvedPath: "tests/first100/layer-package-map.json"
        reason: "Scope widening for the per-package layer classification the checker needs and the repository does not have. A group-directory map cannot express packages/core/, which packages/README.md itself describes as the Product API spine AND the concrete loop -- two layers in one directory. The map could not be authored inside check-layer-deps.mjs without the checker owning its own classification, and could not go in the root architecture.layers.json, which spec/first100-owner-map.json records as SOLE-owned by P0-03. Authored under the constraint that makes it evidence rather than fitting: signed by a party who had NOT seen the violation counts, published before any run, with the expected outcome for the ambiguous packages recorded in advance -- the file itself carries signerHadSeenViolationCounts:false and publishedBeforeAnyRun:true. dsh-agent keeps the ACCEPTED C-stage table's orchestration-runtime with its role contradiction recorded rather than resolved, since a Usage stage does not overturn an accepted Contract stage. See BLOCKED-053's generalization: write any input that determines what a gate reports from the source of truth, publish it, then run. The epic's must/acceptance clauses are unchanged."
