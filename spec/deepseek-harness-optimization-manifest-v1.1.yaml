        reason: "Scope widening: the declared types.ts is a pure type file, so acceptance[2]'s Inventory half cannot be exercised there. Adding an optional provenanceAudit field to a type nothing populates, tested by a spec that constructs the object literal itself, asserts a fact about TypeScript rather than about the product -- the BLOCKED-052 shape. buildPluginPermissionStates in index.ts is the real producer over live Loader entries (PluginInventoryGateway.list deliberately does not expose permission states). Package manifests, tsconfigs and READMEs ride along as build infrastructure. Note index.ts:341 already claims apps/cli calls this function for acceptance[1]'s display, which grep shows it does not; this stage makes that comment true. The epic's must/acceptance clauses are unchanged, and must[0]/must[2]/must[4] plus acceptance[0]'s swap-repo and forge-builder vectors remain locked under BLOCKED-050."
