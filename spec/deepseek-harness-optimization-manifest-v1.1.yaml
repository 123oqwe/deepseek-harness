        declaredPath: "packages/extensions/cordis-host-runner/src/registry.ts"
        approvedPath: "packages/extensions/cordis-host-runner/src/guard.ts"
        reason: "Scope widening to the only non-vendored adjudication point for Service and Event registration. The epic's title and must[0] name Service/Tool/Event, but within the declared four files only the Tool surface can fail closed: ctx.provide and ctx.on are implemented in vendor/cordis/src/{reflect,events}.ts. guard.ts's sandbox context facade whitelists ctx.provide/ctx.on/ctx.tools.register (CTX_VERBS) and is where a dynamic plugin's registration can be refused before it reaches Cordis, which is what makes acceptance[2] non-vacuous. Static-origin Service/Event enforcement would require modifying vendored Cordis -- explicitly NOT requested and refused: those are logged local modifications under the vendoring policy, and docs/architecture/trust-kernel-boundary.md requires the vendored Fiber fix (Option A, verified unlanded) before any epic wires a real policy enforcement point consuming the kernel. must[0] is therefore scoped to Tool across all origins plus Service/Event for dynamic origin, with static-origin Service/Event recorded as a named residual against that prerequisite. Acyclicity of all three consumer edges proven by running tsc -b with real value imports, not by reading manifests. The epic's must/acceptance clauses are unchanged."
