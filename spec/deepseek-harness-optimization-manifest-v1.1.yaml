        approvedPath: "packages/core/agent-loop/src/tool-calls.ts + docs/architecture.md"
        reason: "WIDENING, not substitution: the declared path is unchanged and still written. Root CLAUDE.md requires that changing agent-loop be accompanied by a docs/architecture.md update, and that file appears in no stage of P2-03, so the registry authorizes the loop edit while the repository's own rule requires a companion edit outside the authorization. docs/architecture.md is declared only by P0-02.U, and P0-02 is ACCEPTED -- verified before approving that none of P0-02's frozen cases assert anything about that file's content, so editing it cannot invalidate P0-02's green; this is not a quiet edit to an accepted row. Class-level reasoning, the 21 epics that will hit this, and the fact that P2-01 already changed the loop without the doc update (recorded against P2-01, NOT discharged here) are in BLOCKED-076. Patches for the other 20 epics are added when their stage is dispatched, never in bulk, per BLOCKED-070."
