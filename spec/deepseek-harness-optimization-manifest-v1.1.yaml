        reason: "Architecturally unrealizable as declared, not a convenience relocation -- a strictly stronger basis than a path-spelling correction. P6-07's declared P-stage deliverables sit in packages/session/session-persistence/src/, but a durable session-lifecycle registry must name SessionLifecycleRecord/SessionDisposition and call the C-stage's listSessions/assertNoLegalHold/hardErase/propagateDeletion. That import closes a real project-reference cycle, verified by running the compiler rather than by reading manifests: session-persistence -> session-lifecycle -> workspace/workspace -> session-persistence, where the latter two edges already exist (session-lifecycle peer-depends on dsh-workspace; workspace/workspace peer-depends on dsh-session-persistence). `pnpm exec tsc -b packages/session/session-persistence/tsconfig.json` reports TS6202 on a branch carrying the declared edge. No level of effort inside the declared scope avoids this: every P6-07 clause is an assertion about lifecycle semantics (must[0]'s filters ARE listSessions; acceptance[1]'s hold IS assertNoLegalHold; acceptance[2]'s propagation IS propagateDeletion), so a record-type-generic store that cannot name a disposition observes none of them and proves only that a JSON document round-trips. A variant exploiting tsconfig.host.json's direct inclusion of packages/*/*/tests/** (letting a test import what src/ may not) was also rejected: it would produce real observations while no shipped code assembles the service, making a fixture read as a product surface -- worse than an honest gap, because it greens. The reverse direction is acyclic and is the natural one: the package owning the decisions gains the durable store beneath them. session-lifecycle is not referenced by any other package's tsconfig (apps/web/tsconfig.json does reference it, but an application is a terminal consumer and does not enter the inter-package dependency graph), and session-persistence's transitive closure (cosmokit, cordis, b