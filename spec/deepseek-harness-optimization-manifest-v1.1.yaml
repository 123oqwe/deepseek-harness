  deliverablePathPatches:
    status: "ADJUDICATED"
    count: 36
    note: "Maintainer-approved amendments to an epic's declared deliverable path where the byte-locked registry.epics[].files[]/stages[].files path (extracted verbatim from the pinned planning sources, itself frozen to the baseline SHA current when the source was authored) collides with an unrelated existing artifact discovered during implementation, or is otherwise provably unbuildable as declared (BLOCKED-012's class: a forced same-stage deviation, e.g. a real dependency cycle). The registry path stays byte-locked and unedited; this overlay records the approved substitute path a Writer must target instead. A patch never re-scopes the epic's must/acceptance/nonGoals clauses -- only the on-disk path of the named deliverable. An entry's object key is unique per patch (never reused); `epic` names the real epic id when it differs from the key (BLOCKED-012 entries use a descriptive key since one epic/stage can carry more than one patch)."
    entries:
      P2-01-U-agent-identity-attachment:
        epic: "P2-01"
        stage: "U"
        declaredPath: "packages/core/agent-loop/src/runtime-context.ts"
        approvedPath: "packages/core/agent-loop/src/agent.ts"
        reason: "BLOCKED-012 companion split, not a pure substitution: runtime-context.ts's only pre-existing export, RuntimeContextProjection, is a dynamic-context-snapshot class (durably projects rendered system-prompt sections as a UserMessage) structurally unrelated to identity -- it has no notion of a live Agent instance to attach identity to. This slice adds real, substantive identity logic directly to runtime-context.ts itself (lastAttachedIdentity, resolveSessionIdentity -- the pure runtime-policy-layer functions satisfying registry P2-01 acceptance[1]'s real assertRuntimeTenantPolicy caller), so the declared file is not abandoned. But the ONE place Agent.identity (packages/core/agent/src/types.ts, C-stage) can actually become a real, populated field for a live agent is ReactLoopAgent's own constructor (agent.ts) -- the sole `implements Agent` class in this codebase; no other file constructs a live Agent. Making acceptance[0] real (\"any action traceable to root user/tenant\") requires this exact constructor to call the new runtime-context.ts functions and assign `this.identity`. Owner-map check (spec/first100-owner-map.json byFile, 441 entries): packages/core/agent-loop/src/agent.ts is absent -- shared/common infrastructure, not owned by any single epic, zero conflict."
        approvedAt: "2026-09-02"
        basis: "spec/first100/exec/BLOCKED-QUEUE.md#BLOCKED-012"
      P2-01-U-sdk-server-identity-population:
        epic: "P2-01"
        stage: "U"
        declaredPath: "packages/sdk/protocol/src/types.ts"
        approvedPath: "packages/sdk/server/src/server.ts"
        reason: "BLOCKED-012 companion, not a substitution: packages/sdk/protocol/src/types.ts itself received the real, substantive must[1] change (SessionPromptResult gained an optional `identity?: IdentityContext` field, and SdkIdentityReference's doc now records the BLOCKED-025 disposition -- see that entry below). This companion patch covers only the small (4-line), necessary producer wiring that populates the new field with a genuine value: HarnessSdkJsonRpcServer.prompt() (packages/sdk/server/src/server.ts, the one real implementation of the session/prompt RPC method) already holds `rec.handle.agent` (an Agent, per packages/core/agent/src/types.ts); this patch adds `...identity === undefined ? {} : { identity: rec.handle.agent.identity }` to its existing return statement, sourced from the server's own already-live Agent.identity (real as of this slice's agent.ts wiring, P2-01-U-agent-identity-attachment above), never from client input. Without this, the new type field would be genuine-but-unpopulated (an unused field, the exact gap U-stage exists to close per acceptance[0]). Owner-map check (spec/first100-owner-map.json byFile, 441 entries): packages/sdk/server/src/server.ts is absent -- shared/common infrastructure, zero conflict."
        approvedAt: "2026-09-02"
        basis: "spec/first100/exec/BLOCKED-QUEUE.md#BLOCKED-012"
      P0-01:
        stage: "C"
