        stage: "F"
        declaredPath: "packages/run/run/tests/state-machine.spec.ts"
        approvedPath: "packages/run/run/src/index.ts"
        reason: "Scope widening, not substitution: the declared file keeps its work. packages/run/run/tests/state-machine.spec.ts covers src/state-machine.ts and src/events.ts, which are pure functions over caller-supplied values -- no file, no process, no shared state -- and C-stage's exhaustive 10x10 state-pair sweep already settled every decision they make, so no fault remains to inject there. Every fault this stage reproduced against the landed code lives in the durable/concurrent layer instead: two concurrent RunService.advance calls both accepted mutually exclusive exits from one state and an accepted transition vanished from the append-only log (must[1] + acceptance[1]); two stores over one path in one process collide on the pid-derived temp name; a tampered store document restores a Run in a state outside must[0]'s closed set and offers it for resumption; a seq gap makes the next append mint a backwards seq. All four are fixed in packages/run/run/src/index.ts and nowhere else. The epic's other declared F file, packages/session/session-persistence/src/coordinator.ts, cannot host any of them: every PersistenceCoordinator entry point is keyed on SessionId, its records are SessionEvents under SESSION_FORMAT_VERSION, and its states/chains/retirements maps are all keyed by SessionId -- there is no notion of a Run in it to inject a Run fault into, so it stays declared-but-unmodified exactly as at P-stage. Precedent for an F stage editing production source to fix what its own fault cases prove: P0-05.F (packages/migration/feature-gates/src/index.ts) and P2-01.F (packages/core/agent-loop/src/runtime-context.ts). This patch re-scopes no must/acceptance/nonGoals clause; it names one additional on-disk path."
