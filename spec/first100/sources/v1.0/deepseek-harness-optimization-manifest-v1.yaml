principles:
- Everything except the minimal immutable Trust Kernel is pluggable.
- Service Definition -> Provider -> Consumer.
- Model-visible iff logged.
- Canonical ledgers are the source of truth.
- Policy deny is monotonic.
- Idempotency and reconciliation precede retry.
- Executor, approver, verifier, and memory writer are separated by default.
- No self-modification without proposal, evaluation, canary, signature, and approval.
- Vertical domain logic stays in skills/workflows/providers and test fixtures.
