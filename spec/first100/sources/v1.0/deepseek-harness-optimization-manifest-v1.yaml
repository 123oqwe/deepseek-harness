  - TS/Python 客户端在同一 fault trace 下得到相同最终资源投影。
  dependencies:
  - P4-06
  - P7-07
  - P8-02
  non_goals:
  - 不保证 token-level assistant chunk 永久保留；关键状态事件必须 durable。
