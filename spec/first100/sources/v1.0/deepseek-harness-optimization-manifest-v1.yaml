- id: P8-05
  phase: Phase 8 — Protocol、Control Plane、Enterprise Governance 与发布可靠性
  priority: P0
  title: Resumable Event Streaming：Cursor、ACK、Replay、Dedupe 与 Backpressure
  purpose: 保证客户端断线、网络抖动和高事件量下不丢关键状态，也不会无限占用内存。
  problem: 当前通知流缺少正式 cursor/ack/replay 语义；断线后只能重新建立连接并自行猜测遗漏，慢客户端也可能拖垮服务端。
  target_files:
  - path: packages/sdk/protocol/src/transport.ts
    status: baseline
