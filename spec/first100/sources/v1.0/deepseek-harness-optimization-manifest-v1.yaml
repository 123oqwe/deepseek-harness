  implementation_prompt: '你正在官方仓库 deepseek-ai/deepseek-harness 上实现 P0-02 — 确立 Minimal Immutable Trust Kernel 边界。

    基线提交：b150a551b8d465e31e418e1b2eaf5e79bbb7d28e


    必须遵守：

    1. 先阅读 AGENTS.md、相关包 README/AGENTS 和 Agent Notes。

    2. 只实现本项与必要的通用 Capability Seam；禁止垂直业务逻辑。

    3. Service Definition → Provider → Consumer；禁止无扩展点地堆入 Agent Loop。

    4. Model-visible iff logged；Policy deny 单调；状态事实来自 canonical ledger。

    5. 先写红灯测试，再实现；不得相信模型自报完成。

    6. 未运行测试必须标 NOT_RUN，不得标 PASS。


    目的：

    保留 Cordis 的可组合性，同时建立插件绝对不能替换或绕过的最小可信计算基。


    缺陷：

    现有架构明确强调没有 privileged core；这对组合性很好，但不适合身份、权限、签名根、审计完整性和沙箱证明等安全根。插件若能替换限制自己的服务，生产级不变量无法成立。


