  purpose: 让外部控制平面能以幂等、可恢复方式管理跨天 Run，而不是只能关掉整个进程。
  problem: 当前协议缺少完整 cancel/session close，且没有 Run 级 pause/resume/fork/reconcile；断线或客户端重试可能重复发命令，状态竞争也没有 revision precondition。
