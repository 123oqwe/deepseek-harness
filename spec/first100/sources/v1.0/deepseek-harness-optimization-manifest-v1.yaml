- id: P0-02
  phase: Phase 0 — 基线、迁移与工程门禁
  priority: P0
  title: 确立 Minimal Immutable Trust Kernel 边界
  purpose: 保留 Cordis 的可组合性，同时建立插件绝对不能替换或绕过的最小可信计算基。
  problem: 现有架构明确强调没有 privileged core；这对组合性很好，但不适合身份、权限、签名根、审计完整性和沙箱证明等安全根。插件若能替换限制自己的服务，生产级不变量无法成立。
  target_files:
  - path: docs/architecture.md
    status: baseline
    audit_sha: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
  - path: README.md
    status: baseline
    audit_sha: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
  - path: packages/README.md
    status: baseline
    audit_sha: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
  - path: AGENTS.md
    status: baseline
    audit_sha: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
  - path: apps/cli/src/profile-boot.ts
    status: baseline
    audit_sha: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
  - path: packages/boot/app-boot/src/index.ts
    status: baseline
    audit_sha: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
  new_files:
  - path: docs/architecture/trust-kernel-boundary.md
    status: new
  - path: packages/kernel/trust-kernel/src/index.ts
    status: new
  - path: packages/kernel/trust-kernel/src/types.ts
    status: new
  - path: packages/kernel/trust-kernel/src/invariant.ts
    status: new
  - path: packages/kernel/trust-kernel/tests/boundary.spec.ts
    status: new
  changes:
  - 在 Cordis Context 创建前初始化 TrustKernel；它只拥有 root identity、signature roots、policy enforcement entrypoint、audit append、secret broker handle、sandbox
    attestation verifier。
  - 禁止 TrustKernel 注册成可替换 Cordis Service；只向运行时发放窄接口和不可伪造 handle。
  - 文档明确哪些仍是插件：模型、工具、存储 provider、workflow、memory provider、UI；哪些永远不是插件：根身份、deny enforcement、审计链根、签名验证根。
  acceptance_criteria:
  - 任意插件卸载、覆盖 service 或动态 mount 都不能替换 kernel policy/audit/signature verifier。
  - Kernel API 无模型可见文本、无业务领域逻辑、无具体 provider 实现。
  - 未初始化 kernel 时，生产 profile 必须 fail closed；开发 profile 可显式启用 insecure 模式并显示永久警告。
  validation:
  - 新增恶意插件测试，尝试覆盖 policy/audit/signature services，必须被 boot 阶段拒绝。
  - 运行架构依赖检查，确保 kernel 不依赖 Cordis product packages。
  - 运行默认 web/headless profile smoke test，确认兼容模式仍能启动。
  dependencies:
  - P0-01
  non_goals:
