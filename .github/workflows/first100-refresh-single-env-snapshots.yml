name: first100 refresh single-environment snapshots

# BLOCKED-110/112. Some recorded scenarios run in exactly ONE environment: the
# pwsh ones need a real `pwsh`, which a macOS developer host does not have, so
# they self-skip there and a local refresh silently leaves them describing an
# older build.
#
# The standing rule is "never refresh on CI", and its real reason is not that CI
# paths would leak into the expectations — that is a consequence. The reason is
# that the refresh LOCATION must not be able to hide a gap in normalization: if
# normalization is complete the location cannot matter, and if it is incomplete
# every location is wrong, differing only in which side goes red.
#
# For a scenario with only one side, that consequence cannot appear, so the
# reason has to be guarded directly instead. This workflow therefore refreshes
# nothing into the repository. It emits the rewritten expectations as an
# artifact, and admission is a byte-level diff against the delta that is
# supposed to be there. Anything else in that diff — a runner path, a hostname,
# a timestamp, a CI environment variable — is a normalization gap and a real
# finding, exactly as the sandbox failure was.
#
# The diff is admission, not acceptance. Acceptance is the next ordinary run
# comparing against the committed result.

# Triggered by pushing a branch under `refresh-snapshots/`, not by
# workflow_dispatch: dispatch requires the workflow to exist on the fork's
# DEFAULT branch, and this program has no business pushing to that branch to
# gain a button. A throwaway branch is the narrower path, and it leaves the
# trigger visible in history.
on:
  push:
    branches:
      - refresh-snapshots/**

env:
  SCENARIOS: pwsh-tool-turn persistent-pwsh-tool-turn

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify pwsh is present
        # The whole point of refreshing here is that this host can run what the
        # developer host cannot. If pwsh were missing the scenarios would skip
        # and the refresh would produce nothing while reporting success — the
        # partial-refresh failure this workflow exists to escape.
        run: pwsh --version

      - name: Build (the scenarios launch a real dsh process)
        # The headless snapshot scenarios boot the shipped profile, which
        # resolves built `lib/typert.host.js` artifacts. Without this the run
        # fails with ERR_MODULE_NOT_FOUND and reports it as a scenario failure —
        # the artifact plane missing, misread as the source plane being wrong.
        env:
          DSH_BUILD_CLIENT_PROFILE: official
        run: pnpm run build

      - name: Refresh the named scenarios
        env:
          DSH_SNAPSHOT: refresh
        run: |
          set -o pipefail
          # One `-t` per invocation: vitest accepts a single value for it, and
          # passing two threw `Expected a single value for option`. The first
          # version wrapped the call in `|| true` to tolerate the deliberate
          # partial-refresh failure (BLOCKED-110), and that also swallowed this
          # error — the run reported success while nothing had executed. The
          # tolerance is now narrow: each invocation is reported, and the
          # change-detection step below is what decides whether anything ran.
          for scenario in $SCENARIOS; do
            echo "::group::refresh $scenario"
            pnpm exec vitest run --config vitest.snapshot.config.ts -t "$scenario" && status=0 || status=$?
            echo "$scenario: vitest exited $status"
            echo "::endgroup::"
          done
          pnpm exec tsx scripts/migrate-packed-session-fixtures.ts

      - name: Show what changed, and fail if nothing did
        run: |
          git --no-pager diff --stat
          if git diff --quiet; then
            echo "::error::the refresh changed nothing; the scenarios did not run here either"
            exit 1
          fi

      - name: Upload the rewritten expectations
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-single-env-snapshots
          path: snapshots/**
          if-no-files-found: error
