# Publish the dsh release sequence to npm. This workflow is manual-only
# (workflow_dispatch) and intentionally does not listen to pull_request or push:
# publication must always be an explicit, reviewed act from a dsh-v* tag, and it
# must never appear as a PR check. It repacks the current tree before publishing
# so the bytes uploaded are exactly what this dispatch produced.
name: Release publish (dsh)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    name: Pack npm tarballs
    runs-on: ubuntu-24.04
    steps:
      # Complete history: the release scripts read tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        env:
          RELEASE_PUBLISH: 'true'
        run: pnpm run release:verify --family dsh

      - name: Build
        run: pnpm run build:official

      - name: Pack release tarballs
        run: pnpm run release:pack --family dsh --out dist/npm

      # The harness packages declare the vendored framework as a peer, and this
      # verification must not depend on the registry already carrying matching
      # versions — one pull request may bump both families before either
      # publishes — so it installs that family's pack output too. Only dist/npm
      # is published.
      - name: Pack the vendored framework for verification
        run: pnpm run release:pack --family vendor --out dist/npm-vendor

      # dsh-sandbox-local declares the Landlock entry as a runtime dependency, so
      # the verification needs its tarball. Its platform packages stay out: they
      # are optional, and building them needs a musl toolchain per architecture.
      - name: Pack the Landlock entry for verification
        run: |
          pnpm --dir native/system run build:ts
          pnpm --dir native/system/packages/entry pack --pack-destination "$PWD/dist/npm-landlock"

      # P0-07 validation[2]: the evidence verifier is the LAST step of the
      # release script. Everything from here to that step is the evidence
      # chain, and it sits after packing because `init` must already name the
      # artifacts it will require -- they do not exist until the packs above
      # have run.
      #
      # `--base-sha` is the family's previous release. `release:verify` below
      # already requires this run to come from a `<tagPrefix>*` tag
      # (`scripts/release/verify.ts:53-68`), so "the previous release" is the
      # previous tag with that prefix; nothing here parses a tag format of its
      # own. When there is none -- a family's first release -- the fallback is
      # git's empty tree, and it is NOT silent: the line below says so, and the
      # value itself says so in the package, since `4b825dc6...` is a tree
      # every reader can see is not a release commit. Falling back to `HEAD`
      # instead would bind an empty diff, which `collect-evidence.mjs:240`
      # warns against by name.
      #
      # The prefix is `families.ts:330`'s `dsh` family value, repeated here
      # because no tool prints it. A repeated constant can drift, and the drift
      # would be SILENT in the worst way -- `git describe` would match nothing
      # and this step would report a first release. So a ref that IS a tag and
      # does not carry the prefix is treated as drift and fails loudly.
      #
      # A ref that is not a tag at all is a different case, and not an error:
      # `verify.ts` only checks the tag when `RELEASE_PUBLISH` is `true`
      # (`:102-105`), which this pack job does not set, so dispatching it from
      # a branch to rehearse the packing is a supported thing to do. Such a run
      # takes the latest matching tag reachable from HEAD and says it is a
      # rehearsal.
      - name: Resolve the evidence base SHA
        id: evidence-base
        env:
          TAG_PREFIX: dsh-v
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            "refs/tags/${TAG_PREFIX}"*)
              from=HEAD^
              what="the previous ${TAG_PREFIX} release"
              ;;
            refs/tags/*)
              echo "::error::this run is from tag $REF, which does not carry TAG_PREFIX '$TAG_PREFIX'; the prefix here has drifted from scripts/release/families.ts and the evidence base cannot be resolved" >&2
              exit 2
              ;;
            *)
              from=HEAD
              what="the latest ${TAG_PREFIX} release (rehearsal: $REF is not a tag, so this run publishes nothing)"
              ;;
          esac
          if tag=$(git describe --abbrev=0 --match "${TAG_PREFIX}*" "$from" 2>/dev/null); then
            # `describe` names a TAG, and a tag can be moved. `gitDiff.baseSha`
            # is a `CommitSha` (`evidence-format/src/types.ts:179`) and
            # `collect-evidence.mjs:244-261` records `--base-sha` verbatim after
            # passing it to `git diff`, which accepts a tag name -- so a tag
            # written here would be recorded, and a later move would silently
            # change which commits the package claims to cover.
            base=$(git rev-list -n 1 "$tag")
            echo "evidence base: ${what} ${tag} (${base})"
          else
            # The one value here that is deliberately not a commit: git's empty
            # tree, which is what makes a first release diff against nothing.
            base=4b825dc642cb6eb9a060e54bf8d69288fbee4904
            echo "evidence base: no ${TAG_PREFIX} release reachable from ${from}; falling back to git's empty tree ${base}, so this package's gitDiff covers the whole tree"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      # `init` refuses a checkout that has drifted from its captured baseline
      # (`collect-evidence.mjs:228-233`), so the capture comes first. It
      # rewrites `.dsh/baseline.json`, a TRACKED file, which the last step of
      # this job restores; nothing packed above reads it, and the packs are
      # already written.
      #
      # `--required-artifact` is enumerated from `dist/npm` at this moment, and
      # that is what makes the required set equal the published set BY
      # CONSTRUCTION: the upload step below sends `dist/npm/*` as
      # `dsh-npm-tarballs`, the publish job downloads that same artifact into
      # `dist/npm`, and `publish.ts:146` reads its publish order from that
      # directory. `dist/npm-vendor` and `dist/npm-landlock` are packed for
      # `verify-packed-install` and are NEVER published, so they are
      # deliberately not required here.
      - name: Collect the release evidence package
        run: |
          pnpm baseline:capture && pnpm baseline:verify
          required=()
          for tarball in dist/npm/*; do required+=(--required-artifact "$tarball"); done
          node scripts/release/collect-evidence.mjs init \
            --base-sha "${{ steps.evidence-base.outputs.sha }}" \
            --required-gate release-version \
            --required-gate packed-install \
            "${required[@]}"

      # Run a second time on purpose, the same trade the gate workflow's P0-07
      # step records: the step above is the one that gates the build, and this
      # one asks whether the collector records a real gate's execution. It is
      # the cheap half of the pair -- a version and tag check, not an install.
      #
      # `collect-evidence run` CAPTURES the wrapped command's output into the
      # sidecar instead of inheriting this job's stdout, so the log is printed
      # here afterwards and the step exits with the wrapped status. An operator
      # reading the job log and a verifier recomputing the digest then see the
      # same bytes.
      - name: Record the release-version gate
        run: |
          set +e
          node scripts/release/collect-evidence.mjs run --gate-id release-version -- pnpm run release:verify --family dsh
          status=$?
          set -e
          cat .dsh/evidence/evidence.d/logs/release-version.log || true
          exit $status

      # Wrapped rather than run twice: unlike the version check this one does a
      # real install, so paying for it a second time is not a trade worth
      # taking. Same capture-then-print shape as the step above.
      - name: Verify packed install
        run: |
          set +e
          node scripts/release/collect-evidence.mjs run --gate-id packed-install -- pnpm run release:verify-packed-install --family dsh --from dist/npm --from dist/npm-vendor --from dist/npm-landlock
          status=$?
          set -e
          cat .dsh/evidence/evidence.d/logs/packed-install.log || true
          exit $status

      # One call per artifact: `build-artifact` takes a single `--path`
      # (`collect-evidence.mjs`), digests it, and recomputes `accepted` against
      # the paths `init` declared.
      - name: Digest the published artifacts into the evidence package
        run: |
          for tarball in dist/npm/*; do
            node scripts/release/collect-evidence.mjs build-artifact --path "$tarball"
          done

      # validation[2]'s "last step". It re-derives every digest offline and
      # never re-runs a gate, so it costs seconds and asks only whether what
      # this job recorded is what is on disk.
      - name: Verify the release evidence package
        run: pnpm run evidence:verify --evidence .dsh/evidence/evidence.json
        shell: bash {0}

      # `.dsh/baseline.json` is tracked and `baseline:capture` rewrote it. The
      # evidence sidecar is deliberately NOT removed here -- the verify above
      # has already read it, and leaving it lets the upload step below carry it
      # if a future change wants that.
      - name: Restore the tracked baseline file the evidence capture rewrote
        if: always()
        run: git checkout -- .dsh/baseline.json

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-npm-tarballs
          path: dist/npm/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-24.04
    # Required reviewers and the allowed tags live on the environment; this is
    # the only job in the sequence that can write to the registry.
    environment: npm-publish
    concurrency:
      group: Release-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # Checkout and install carry the release scripts only. There is no build
      # step: publication uploads the bytes the pack job produced.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install (immutable, no package scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: dsh-npm-tarballs
          path: dist/npm

      - name: Publish tarballs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm run release:publish --family dsh --from dist/npm
