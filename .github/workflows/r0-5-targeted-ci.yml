# R0-5 item 1 follow-up — targeted classification probe (task #34)
#
# Purpose: classify the 3 failures seen in run 33068803755 (a full `pnpm
# test` on a clean 4-CPU ubuntu-24.04 runner at the frozen SHA) as either
# flaky-under-load or deterministic-on-Linux. The full-suite failure is
# PRESERVED (receipt r0-5-item1-ci-evidence-33068803755.txt; this workflow
# never re-runs the full suite). This is a NEW, distinct measurement: ONLY
# the 2 failing files run in isolation — the reverse load condition (9 tests
# instead of 14,707) — at the same frozen SHA, same runner class, same vitest
# config and pool. Two samples are taken; EVERY exit code is recorded and
# uploaded, including any red. A green probe classifies the earlier failures
# as load-environmental; it does NOT claim R0-5 item 1 (that requires a real
# full-suite `pnpm test` exit 0).
#
# Contained exactly like the baseline evidence workflow: dedicated fork
# branch, push-trigger on that branch only, contents:read, no secrets, no
# product API, no published artifacts, fail-closed identity gate before any
# test runs, real-exit capture, artifact upload with if: always. No master,
# no PR, no merge, no force-push.
name: R0-5 targeted classification probe (frozen b150a551)

on:
  push:
    branches:
      - codex/r0-5-targeted-ci

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  classify-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fail-closed baseline identity gate
        run: |
          set -euo pipefail
          expected="b150a551b8d465e31e418e1b2eaf5e79bbb7d28e"
          actual="$(git rev-parse HEAD)"
          echo "HEAD=$actual"
          [ "$actual" = "$expected" ] \
            || { echo "::error::HEAD mismatch: expected $expected, got $actual"; exit 1; }
          tree="$(git rev-parse HEAD^{tree})"
          echo "tree=$tree"
          porcelain="$(git status --porcelain)"
          echo "porcelain=$porcelain"
          [ -z "$porcelain" ] \
            || { echo "::error::working tree is not clean"; exit 1; }
          nodev="$(node --version)"
          pnpmv="$(pnpm --version)"
          cpus="$(node --input-type=module -e 'import os from "node:os"; process.stdout.write(String(os.cpus().length))')"
          memgb="$(node --input-type=module -e 'import os from "node:os"; process.stdout.write((os.totalmem()/1073741824).toFixed(1))')"
          osline="$(uname -a)"
          runner="${{ runner.name }} (${{ runner.os }})"
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "gate=passed"
            echo "HEAD=$actual"
            echo "tree=$tree"
            echo "porcelain=$porcelain"
            echo "node=$nodev"
            echo "pnpm=$pnpmv"
            echo "cpus=$cpus"
            echo "mem_gb=$memgb"
            echo "os=$osline"
            echo "runner=$runner"
            echo "started_utc=$started"
          } > r0-5-env.log
          echo "identity-gate: passed (HEAD $actual, tree $tree)"

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # Probe sample 1 — the 2 failing files in isolation. Faithful subset:
      # same `vitest run`, same config, same forks pool, only the file list
      # differs (the reverse load of the failed full suite). Real exit captured.
      - name: Probe sample 1 — isolated local.spec.ts + loader-composition.spec.ts
        env:
          NO_COLOR: 1
        run: |
          set +e
          pnpm exec vitest run \
            packages/terminal/terminal-bash/tests/local.spec.ts \
            packages/shell/tool-pwsh-persistent/tests/loader-composition.spec.ts \
            > r0-5-probe-sample-1.log 2>&1
          status=$?
          set -e
          {
            echo "sample=1"
            echo "real-exit=$status"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "HEAD=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "porcelain=$(git status --porcelain)"
          } | tee -a r0-5-probe-sample-1.log
          echo "===== tail ====="
          tail -n 15 r0-5-probe-sample-1.log
          exit $status

      # Probe sample 2 — identical second invocation: measures whether the
      # isolated result is stable (2/2 clean) or inconsistent. Every exit is
      # recorded; a red sample here is a determinism signal, not hidden.
      - name: Probe sample 2 — isolated rerun (flakiness sample)
        env:
          NO_COLOR: 1
        run: |
          set +e
          pnpm exec vitest run \
            packages/terminal/terminal-bash/tests/local.spec.ts \
            packages/shell/tool-pwsh-persistent/tests/loader-composition.spec.ts \
            > r0-5-probe-sample-2.log 2>&1
          status=$?
          set -e
          {
            echo "sample=2"
            echo "real-exit=$status"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "HEAD=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "porcelain=$(git status --porcelain)"
          } | tee -a r0-5-probe-sample-2.log
          echo "===== tail ====="
          tail -n 15 r0-5-probe-sample-2.log
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r0-5-targeted-b150a551-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            r0-5-probe-sample-1.log
            r0-5-probe-sample-2.log
            r0-5-env.log
          if-no-files-found: error
