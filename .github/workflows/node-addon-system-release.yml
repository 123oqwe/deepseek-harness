# Build and publish the @deepseek-ai/node-addon-system package family from the
# harness source of record. Rehearsal and publication consume the same packed
# tarballs; each native binary is built on its matching architecture.
name: Node Addon System Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packed tarballs to npm. Must run from a node-addon-system-v* tag.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Stable/prerelease dist-tags are shared registry state; serialize release
  # runs so two versions cannot race the final tag assignment.
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: native/system

jobs:
  matrix:
    name: Matrix
    runs-on: ubuntu-24.04
    outputs:
      prebuilds: ${{ steps.matrix.outputs.prebuilds }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        run: echo "prebuilds=$(node ./scripts/github-matrix.mjs release-prebuild)" >> "$GITHUB_OUTPUT"

  build-prebuilds:
    name: ${{ matrix.package }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.prebuilds) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --filter @deepseek-ai/node-addon-system-workspace... --frozen-lockfile

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq musl-tools

      - name: Build native binaries
        run: pnpm build:native

      - name: Verify binary metadata
        run: node ./scripts/verify-launcher-binary.mjs ${{ matrix.dir }}

      - name: Verify the built entry and flock
        run: |
          pnpm build:ts
          pnpm build:test-oracle
          pnpm test:flock
          pnpm test:packaging

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: native/system/${{ matrix.dir }}/bin/**
          if-no-files-found: error
          retention-days: 7

  pack:
    name: Pack npm tarballs
    needs: build-prebuilds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --filter @deepseek-ai/node-addon-system-workspace... --frozen-lockfile

      - name: Build TypeScript
        run: pnpm build:ts

      - name: Verify release version
        run: node ./scripts/verify-release.mjs
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}

      - name: Download prebuild artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: native/system/.release/prebuild-artifacts

      - name: Assemble and verify prebuilds
        run: node ./scripts/assemble-prebuilds.mjs .release/prebuild-artifacts

      - name: Verify release payload
        run: node ./scripts/verify-release.mjs --prebuilds
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}

      - name: Pack release tarballs
        run: node ./scripts/pack-release.mjs dist/npm

      # BLOCKED-292. The third publishing pipeline, wired to the same evidence
      # chain as `release-publish.yml` and `release-vendor-publish.yml`, in the
      # same place: after the tarballs exist and before the upload the publish
      # job downloads from, so a failed verification leaves that job nothing to
      # publish.
      #
      # EVERY STEP BELOW RUNS AT THE REPOSITORY ROOT, against this file's
      # `defaults.run.working-directory: native/system`. The collector takes
      # `--repo-root` (`collect-evidence.mjs:108-109`) and records an artifact
      # under exactly the string it is given (`:346`, digesting
      # `join(repoRoot, path)`), and it runs a wrapped gate with
      # `cwd: repoRoot` (`:305`) -- so the recorded paths and the wrapped
      # commands are written repo-root-relative and the two halves agree by
      # construction rather than by a `cd`.
      #
      # `baseline-fingerprint.mjs` imports `js-yaml`, unlike the four evidence
      # scripts, which are node builtins only. This job's install is filtered
      # to the native workspace, which does not carry the root's devDependency,
      # so the root's own dependencies are installed first.
      #
      # The same command `release-publish.yml:263` already runs, rather than a
      # narrower `--filter` that would be faster: that spelling is proved by a
      # pipeline that runs it, and a narrower one would be proved by nothing
      # until it ran here. A dispatch with `publish: false` runs this job
      # without publishing anything, so the choice is not about whether this
      # can be rehearsed -- it can -- but about which of the two spellings
      # already has a run behind it.
      - name: Install the root workspace for the evidence scripts
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve the evidence base SHA
        id: evidence-base
        working-directory: ${{ github.workspace }}
        env:
          TAG_PREFIX: node-addon-system-v
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            "refs/tags/${TAG_PREFIX}"*)
              from=HEAD^
              what="the previous ${TAG_PREFIX} release"
              ;;
            refs/tags/*)
              echo "::error::this run is from tag $REF, which does not carry TAG_PREFIX '$TAG_PREFIX'; the prefix here has drifted from native/system/scripts/verify-release.mjs and the evidence base cannot be resolved" >&2
              exit 2
              ;;
            *)
              from=HEAD
              what="the latest ${TAG_PREFIX} release (rehearsal: $REF is not a tag, so this run publishes nothing)"
              ;;
          esac
          if tag=$(git describe --abbrev=0 --match "${TAG_PREFIX}*" "$from" 2>/dev/null); then
            # `describe` names a TAG, and a tag can be moved; `gitDiff.baseSha`
            # is a `CommitSha` and the collector records `--base-sha` verbatim.
            base=$(git rev-list -n 1 "$tag")
            echo "evidence base: ${what} ${tag} (${base})"
          else
            # The one value here that is deliberately not a commit: git's empty
            # tree, which is how a first release diffs against nothing.
            base=4b825dc642cb6eb9a060e54bf8d69288fbee4904
            echo "evidence base: no ${TAG_PREFIX} release reachable from ${from}; falling back to git's empty tree ${base}, so this package's gitDiff covers the whole tree"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Collect the release evidence package
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/release/baseline-fingerprint.mjs capture
          node scripts/release/baseline-fingerprint.mjs verify
          required=()
          for tarball in native/system/dist/npm/*; do required+=(--required-artifact "$tarball"); done
          node scripts/release/collect-evidence.mjs init \
            --base-sha "${{ steps.evidence-base.outputs.sha }}" \
            --required-gate release-payload \
            --required-gate packed-install \
            "${required[@]}"

      # Run a second time on purpose, the same trade the other two pipelines
      # record: the step above is the one that gates the build, and this one
      # asks whether the collector records a real gate's execution. Both
      # commands are repo-root-relative because the collector runs them at the
      # repo root; the scripts themselves resolve their own files from their
      # module URL (`native/system/scripts/repo.mjs:14`), so only
      # `verify-packed-install`'s positional path depends on the caller's cwd
      # (`:32`, a bare `path.resolve`).
      - name: Record the release-payload gate
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: |
          set +e
          node scripts/release/collect-evidence.mjs run --gate-id release-payload -- node native/system/scripts/verify-release.mjs --prebuilds
          status=$?
          set -e
          cat .dsh/evidence/evidence.d/logs/release-payload.log || true
          exit $status

      # Wrapped rather than run twice, the same trade the other two pipelines
      # take: this one does a real install, so paying for it again is not worth
      # it. The bare step this replaces ran the same script with the same env,
      # from `native/system` with a `dist/npm` argument; here the collector
      # runs it from the repo root, so the same directory is named
      # `native/system/dist/npm`.
      - name: Verify packed install (wrapped, so the evidence records it)
        working-directory: ${{ github.workspace }}
        env:
          NALR_REQUIRE_LANDLOCK: 1
        run: |
          set +e
          node scripts/release/collect-evidence.mjs run --gate-id packed-install -- node native/system/scripts/verify-packed-install.mjs native/system/dist/npm
          status=$?
          set -e
          cat .dsh/evidence/evidence.d/logs/packed-install.log || true
          exit $status

      - name: Digest the published artifacts into the evidence package
        working-directory: ${{ github.workspace }}
        run: |
          for tarball in native/system/dist/npm/*; do
            node scripts/release/collect-evidence.mjs build-artifact --path "$tarball"
          done

      - name: Verify the release evidence package
        working-directory: ${{ github.workspace }}
        run: node scripts/release/verify-evidence.mjs --evidence .dsh/evidence/evidence.json

      - name: Restore the tracked baseline file the evidence capture rewrote
        if: always()
        working-directory: ${{ github.workspace }}
        run: git checkout -- .dsh/baseline.json

      - name: Upload npm tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: native/system/dist/npm/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    if: inputs.publish
    needs: pack
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # The publish script is the only repository file this job needs, and it
      # imports nothing outside Node's builtins, so there is no install step.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download npm tarballs
        uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: native/system/dist/npm

      - name: Configure npm token fallback
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            echo "NODE_AUTH_TOKEN=$NPM_TOKEN" >> "$GITHUB_ENV"
          fi

      - name: Publish tarballs
        # Publication is decided per package against the registry, so re-running
        # this job over the same artifact skips what already landed instead of
        # failing on it. A bare `npm publish` loop could not be retried: the
        # registry answers a repeat of an existing version permanently.
        run: node ./scripts/publish-release.mjs dist/npm
