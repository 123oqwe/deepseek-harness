name: First-100 exact-SHA

# Maintainer decision A4: the only new CI file. `ci.yml`'s workflow_dispatch
# only runs the benchmark job, and its test jobs trigger on pull_request only
# — no channel exists to run the full gate against an arbitrary candidate
# SHA. This workflow is that channel, and per A4/B7① it is the ONLY place a
# ledger cell may be greened from: `scripts/first100/generate-ledger.mjs`
# only accepts a vitest --reporter=json report + this workflow's run URL; a
# locally-signed observation is advisory only, never ledger-greening.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit SHA to check out and gate (defaults to the triggering ref's SHA)
        required: false
      reanchor_upstream:
        description: 'Re-anchor upstream SHA override; empty uses the workflow''s current re-anchor upstream (the REANCHOR_UPSTREAM policy note below). Changed files byte-identical to it are excluded from changed-file lint.'
        required: false
        default: ''
      refresh_snapshots:
        description: 'Run the recorded-session REFRESH and hand the rewritten fixtures out as an artifact. Never commits. Off for an ordinary gate run.'
        required: false
        type: boolean
        default: false
      narrow_test:
        description: 'Vitest path(s) to run ALONE, skipping the full gate. Empty runs the ordinary gate. Use for a sensitivity proof, where a full run costs 35 minutes to answer a question about one file.'
        required: false
        default: ''
      narrow_build:
        description: 'Build before the narrow run. Only for paths that execute built lib/ — the source lane needs no build.'
        required: false
        type: boolean
        default: false
      narrow_python:
        description: 'Run ONLY the keyless Python SDK suite, naming every case (pytest -rA) and uploading a JUnit report, skipping the gate. For a Python sensitivity proof; not a ledger observation.'
        required: false
        type: boolean
        default: false
  push:
    branches: [first100-exec]

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  exact-sha-gate:
    name: install / typecheck / test @ exact SHA
    runs-on: ubuntu-latest
    # A narrow run answers ONE question about one path; paying 35 minutes for
    # the whole gate to answer it is what this input exists to avoid. Empty --
    # which is what every `push` and every ordinary dispatch carries -- leaves
    # this job byte-for-byte as it was.
    if: ${{ !inputs.narrow_test && !inputs.narrow_python }}
    outputs:
      candidate-sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
      - name: Resolve candidate SHA
        id: resolve-sha
        run: |
          sha="${{ github.event.inputs.sha }}"
          if [ -z "$sha" ]; then sha="${{ github.sha }}"; fi
          # The candidate SHA is the identity of every observation this run produces.
          # An abbreviated or mistyped one either checks out something else or fails
          # at checkout, while the ledger records the string given here (BLOCKED-015).
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "resolve-sha: cannot decide — the candidate SHA must be 40 lowercase hex characters (got \"$sha\")" >&2
            exit 2
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve-sha.outputs.sha }}
          persist-credentials: false
          # Full history, because the registry gate set asks git questions about
          # commits other than HEAD: verify-baseline-file-references resolves the
          # frozen baseline 4e84901e and refuses when it is not locally
          # reachable. Under the default depth-1 checkout that gate could never
          # pass in CI, which is why it went unnoticed until the set was wired —
          # it had only ever run on developer machines with full clones.
          fetch-depth: 0

      # Fail loud if the checked-out tree is not actually at the requested
      # SHA (a moved branch ref, a typo'd short SHA) — every downstream
      # artifact binds to this exact value.
      - name: Verify checkout landed on the requested SHA
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "${{ steps.resolve-sha.outputs.sha }}" ]; then
            echo "::error::checked out $actual, requested ${{ steps.resolve-sha.outputs.sha }}"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Install a sandbox backend (bubblewrap)
        # Ordered after `Install (immutable)`: the probe runs through tsx from
        # node_modules, so placing it earlier would fail on a missing dependency
        # and report that as a sandbox-capability failure.
        # BLOCKED-112. Without one, `dsh-sandbox-local` refuses to run a confined
        # command rather than silently dropping confinement — the right product
        # behaviour, which makes every sandboxed-bash scenario produce an error
        # where the fixture recorded output. Letting those scenarios skip instead
        # would leave the path that decides whether a model's command runs
        # confined untested everywhere. Decision A2 already lists this capability.
        #
        # The AppArmor sysctl is here because the runner ASKED for it: the probe
        # reported `bwrap: setting up uid map: Permission denied`, which is
        # Ubuntu 24.04 restricting unprivileged user namespaces. It is not
        # written from memory of that restriction — an earlier guess at the cause
        # (a network namespace) was wrong, and only the probe's own message
        # distinguished them.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Read the key before setting it. It exists only on kernels carrying
          # Ubuntu's unprivileged-userns restriction, and `sysctl -w` on an absent
          # key fails with a message about the key rather than about sandboxing —
          # which would send the next reader looking for a permissions problem
          # that is really a wrong-kernel problem.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            echo "AppArmor userns restriction present; lifting it for this runner"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "no kernel.apparmor_restrict_unprivileged_userns on this kernel; leaving sysctls alone"
          fi
          pnpm exec tsx scripts/probe-sandbox-backend.ts


      - name: Typecheck
        run: pnpm run typecheck

      # P0-01's and P0-07's own `verifyCommand`s, which 22 workflows ran zero
      # times (BLOCKED-271). They sit HERE — after `Typecheck`, before the
      # registry gate set — for two reasons. `baseline-fingerprint.mjs` reads
      # only source paths (`packages/sdk/protocol/src/types.ts`,
      # `packages/core/session/src/known-event-types.ts`,
      # `packages/bundle/base/cordis.patch.yml`), so nothing needs to be built
      # first; and `capture` WRITES `.dsh/baseline.json`, a tracked file, so the
      # block is kept contiguous and cleaned up before any later step reads the
      # tree.
      #
      # What this proves: that the baseline fingerprint can be captured and
      # verified in one checkout, and that the evidence collector can wrap a
      # real gate, record its exit code and log digest, and have the result
      # verified. What it does NOT prove: that the committed `.dsh/baseline.json`
      # matches this tree — `capture` overwrites it first, which is what the
      # registry's own `pnpm baseline:capture && pnpm baseline:verify` asks for.
      # Drift against the committed baseline is `baseline-preflight`'s question,
      # not this step's.
      - name: P0-01 verifyCommand — capture the baseline and verify it in the same checkout
        if: always()
        run: pnpm baseline:capture && pnpm baseline:verify

      # NOT the registry's literal `pnpm evidence:collect -- pnpm test`: that
      # script takes a subcommand (`init` / `run` / `build-artifact`) and throws
      # `unknown subcommand undefined` without one, so the command as written
      # has never been runnable. The deviation is recorded in BLOCKED-271.
      # `init` requires a captured, undrifted baseline, which is why the step
      # above is not cleaned up before this one — P0-01's report being the
      # evidence package's first item is P0-01 validation[3].
      #
      # The wrapped gate is `typecheck`, run a second time on purpose: the
      # step above it is the one that gates the build, and this one asks
      # whether the collector records a real gate's execution. `run` exits with
      # the wrapped command's own status, so a failure here fails the step.
      # `init` takes two flags this step cannot omit. `--base-sha` is REQUIRED —
      # it throws `--base-sha is required` and exits before doing anything
      # (`scripts/release/collect-evidence.mjs:222`), which is why the first
      # version of this step went red in zero seconds. Its only use is the
      # `gitDiff` the package binds (P0-07 must[1]), and the script's own
      # comment explains why it has no default: the baseline's `gitSha` IS this
      # HEAD, so defaulting there would bind an empty diff, and the real
      # comparison point is a release decision. `HEAD^` is what this step
      # chooses: it always exists under this workflow's `fetch-depth: 0`, and it
      # binds a real, non-empty diff. It does NOT claim to be the release's
      # comparison point — this step proves the collector works, not that this
      # candidate is a release.
      #
      # `--required-gate` decides which half of the package the wrapped gate
      # lands in: without it `requiredGates` is empty, the gate is recorded as
      # an ADDITIONAL one, and `accepted` is computed over nothing. Naming it
      # here is what makes the verify below a check rather than a formality.
      - name: P0-07 verifyCommand — collect evidence over a real gate and verify the package
        if: always()
        run: |
          # The sha is computed on its own line, under `set -e`, and echoed. A
          # command substitution that fails inside an argument does NOT stop a
          # `bash -e` step: `--base-sha` would then receive an empty string,
          # which is not `undefined`, so `cmdInit`'s own guard lets it through
          # and the failure surfaces three lines later as `git diff '' HEAD`.
          # That reads exactly like the guard firing, so the two causes were
          # indistinguishable from the step's output alone.
          set -euo pipefail
          base_sha="$(git rev-parse HEAD^)"
          echo "evidence base-sha: ${base_sha}"
          node scripts/release/collect-evidence.mjs init --base-sha "${base_sha}" --required-gate typecheck
          # `--gate-id`, not `--gate`: `cmdRun` reads `--gate-id`
          # (`scripts/release/collect-evidence.mjs:260-261`) and `parseFlags`
          # accepts any `--x value` pair without complaint, so a wrong flag name
          # is not an unknown-argument error — it is simply never read, and the
          # command throws for a missing value it was given under another name.
          node scripts/release/collect-evidence.mjs run --gate-id typecheck -- pnpm run typecheck
          # `--evidence` is REQUIRED (`scripts/release/verify-evidence.mjs:219-220`
          # throws without it), and the bare `pnpm evidence:verify` that stood
          # here threw on every run after `init` and `run` had both succeeded --
          # the package was written and accepted, and nothing read it. Written as
          # `P0-07.composition.spec.ts:123` writes it, minus its `--repo-root`,
          # which defaults to the working directory (`collect-evidence.mjs:108`,
          # `verify-evidence.mjs:218`) and is this checkout here.
          pnpm run evidence:verify --evidence .dsh/evidence/evidence.json

      - name: Upload the evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first100-evidence-package-${{ steps.resolve-sha.outputs.sha }}
          # The DIRECTORY, not the package alone. `verify-evidence` re-derives
          # every digest from the sidecar `collect-evidence` writes beside it --
          # `evidence.d/gitdiff.patch`, `evidence.d/manifest.json` and
          # `evidence.d/logs/<gate>.log` (`sidecarDir`,
          # `collect-evidence.mjs:104`) -- and treats a missing manifest as a
          # hard failure. Uploading `evidence.json` by itself produced an
          # artifact nobody could re-verify offline, which is the one thing a
          # release evidence package is for.
          #
          # `.dsh/baseline.json` travels WITH it, because the verifier re-hashes
          # that file against the package's `baselineFingerprint`
          # (`verify-evidence.mjs:166-174`) and reports `no .dsh/baseline.json`
          # as a mismatch when it is absent. Measured on run 35449457652: an
          # offline re-verification of the downloaded artifact failed on that one
          # line and nothing else, so the package was complete except for the
          # file that proves which tree it describes.
          #
          # This step's POSITION is what makes the pair consistent: it runs
          # before "Restore the tracked baseline files the two steps above
          # rewrote", so the uploaded `baseline.json` is the one the fingerprint
          # was computed against rather than the restored original.
          #
          # Two paths make upload-artifact root the archive at their least
          # common ancestor, `.dsh/`, so the download extracts as
          # `evidence/evidence.json`, `evidence/evidence.d/…` and
          # `baseline.json`. To re-verify offline, check out this run's
          # candidate SHA, put that content at `<repo>/.dsh/` and run
          # `pnpm run evidence:verify --evidence .dsh/evidence/evidence.json`
          # from the repository root under this job's Node and pnpm versions:
          # the verifier re-derives the baseline fingerprint from that checkout
          # and reports a different HEAD or toolchain as drift.
          path: |
            .dsh/evidence/
            .dsh/baseline.json
          if-no-files-found: warn

      # The tree goes back to what was checked out, before anything downstream
      # reads it: the registry gate set, the frozen-title check and the suite
      # all run against source, and one of them (`tests/release/
      # baseline-fingerprint.spec.ts`) reads `.dsh/baseline.json` itself. The
      # diff is printed first so a run that changed the baseline says so in its
      # own log rather than silently reverting.
      - name: Restore the tracked baseline files the two steps above rewrote
        if: always()
        run: |
          git diff --stat -- .dsh/
          git checkout -- .dsh/
          rm -rf .dsh/evidence

      # P0-08's own verifyCommand (BLOCKED-270), as the registry types it, on
      # this job, which configures no model API key. Its exit status says only
      # that the lanes ran and both reports were written, and a module with no
      # entry point also exits 0 -- the state BLOCKED-270 measured -- so the
      # step then reads what the command wrote: the deterministic lane alone,
      # with trials, and a non-empty Markdown report. The invariant verdict is
      # printed and does not decide the step. The reports go to `.artifacts/`,
      # which git ignores, so a report committed by accident cannot stand in
      # for this run's.
      - name: P0-08 verifyCommand — run the deterministic benchmark lane with no external API configured
        if: always()
        timeout-minutes: 2
        run: |
          pnpm benchmark:harness --lane deterministic
          test -s .artifacts/benchmark/report.md
          node -e "const r=JSON.parse(require('node:fs').readFileSync('.artifacts/benchmark/report.json','utf8'));const lanes=r.reports.map(x=>x.lane);if(lanes.join()!=='deterministic'||!(r.reports[0].model.trials>0)){console.error('unexpected report:',JSON.stringify(lanes));process.exit(1)}console.log('deterministic trials',r.reports[0].model.trials,'invariantsHeld',r.invariantsHeld)"

      - name: Upload the P0-08 benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first100-benchmark-report-${{ steps.resolve-sha.outputs.sha }}
          path: .artifacts/benchmark/
          if-no-files-found: warn

      # Every vitest run from here on loads the flock node-api addon through
      # session persistence, and its binary is gitignored. The root `test` and
      # `test:coverage` scripts build it first, and upstream's `ci-coverage` gate
      # runs the same `build:native-system` before vitest; these steps call
      # vitest directly, so the build has to precede the first of them. It runs
      # even after a red Typecheck because every later step does.
      - name: Build the host native-system addon
        if: always()
        run: pnpm run build:native-system

      # The registry gate set, which until 2026-09-06 no workflow ran at all —
      # every gate in it fired only when someone typed the command, and five
      # days of that missed twelve build artifacts committed under a source
      # directory, 23 JSDoc violations, three stale generated documents and
      # three malformed `files` arrays.
      #
      # It asks whether the registry ITSELF is sound, which is a precondition of
      # the observation below rather than part of it: if the registry is wrong,
      # the run proves nothing. One gate is held back, and the runner prints
      # which, why, and what reinstates it, on every run.
      - name: First-100 registry gate set
        if: always()
        run: pnpm run first100:registry-gates

      - name: Full test suite (verbose json reporter — the ledger's observation input)
        # `always()`, even though the gate steps above are preconditions of this
        # observation. When the registry gate set first ran in CI it failed for
        # an environment reason, the suite was skipped, and the run produced NO
        # observation at all — eleven cells were waiting on it. A gate-set
        # failure should cost one round, not one observation. The observation is
        # still unusable for greening while the preconditions are red (the
        # recomputation gate refuses it), but an observation that exists tells
        # you how the suite itself did; one that does not exist tells you
        # nothing.
        if: always()
        run: |
          mkdir -p .artifacts/first100/observations
          pnpm exec vitest run --reporter=json --outputFile=.artifacts/first100/observations/vitest-report.json --reporter=default
        # Real exit is captured, not swallowed: a red suite must fail this
        # job (fail-closed), while the JSON report is still uploaded below
        # via `if: always()` so a RED observation is real, inspectable
        # evidence rather than a silently discarded log.
        #
        # The `default` reporter is additive and prints to the log only; the
        # JSON report keeps its format and path, so predicate (iii)'s input is
        # untouched. It is here because fail-closed was designed and
        # diagnosability was not: vitest can exit non-zero for reasons that
        # never reach `assertionResults` — an unhandled rejection, a teardown
        # throw, a worker crash — and with `json` as the ONLY reporter such a
        # run leaves no trace in either artifact. Run 33943262728 was exactly
        # that: `success: true`, 19305 tests, 0 failures, job conclusion
        # `failure`, and nothing between "JSON report written" and "exit code
        # 1". The report cannot record what it has no field for, and no
        # human-readable reporter was attached to print it.

      # BLOCKED-275(b). `release:verify` runs for real elsewhere in this
      # repository (`release.yml:146`, `release-publish.yml:58`,
      # `docs-pages.yml:65`, all `--family dsh`) but has never run against a
      # First-100 candidate, so P0-05's expiry check --
      # `assertNoExpiredFeatureGates` at `scripts/release/verify.ts:90` -- had
      # never once executed on a SHA this program accepts.
      #
      # What this step proves today is that the gate executes on a candidate
      # and CAN fail: it resolves the dsh family's members, asserts their one
      # shared version, and resolves a publish order, throwing when the order
      # cannot cover every member. What it does NOT prove is that an expired
      # gate would be caught -- `RELEASE_GATE_FEATURE_GATES` is `[]`
      # (`scripts/release/feature-gate-expiry.ts:36`), so the expiry check has
      # nothing to fail against until some epic declares a real gate.
      #
      # `RELEASE_PUBLISH` is unset here, so the publishable/tag gates
      # (`verify.ts:102-106`) stay off: this workflow builds a branch SHA, and
      # `verifyTag` would refuse every candidate that is not a `dsh-v*` tag.
      - name: Verify release version
        if: always()
        run: pnpm run release:verify --family dsh

      # R0 exit gate item 1's other half (packInstall): the exact CI-equivalent
      # build, then pack + verify-packed-install, on Linux CI where the prior
      # local macOS receipt's two known failure causes (stale npm cache,
      # --omit=optional dropping koffi's darwin-arm64-only prebuilt) do not
      # apply. Runs even if the test suite above went red — pack/install
      # health is an independent fact from test-suite health.
      - name: Build (official client profile, the exact env CI's build gate sets)
        if: always()
        env:
          DSH_BUILD_CLIENT_PROFILE: official
        run: pnpm run build

      - name: BLOCKED-285 — a real dsh launcher executes a tool on sdk-minimal
        if: always()
        # The first time this program runs a REAL launcher against the shipped
        # `sdk-minimal` profile. `keyless-smoke.e2e.ts` spawns
        # `apps/cli/src/bin.ts` through `tsx/esm`, which is the SOURCE launch
        # shape, so the Build above is not a prerequisite for it; the
        # packaged-artifact half of the same question is
        # `scripts/smoke-python-runtime.py`'s `minimal` scenario, which no
        # workflow in this repository runs either.
        #
        # Invoked as `pnpm exec vitest run --config vitest.e2e.config.ts`,
        # which is how every other workflow here passes arguments to vitest
        # (`sandbox.yml:115`, `e2b-e2e.yml:57`, and
        # `first100-refresh-single-env-snapshots.yml:87`, which passes `-t`
        # the same way). `pnpm run test:e2e -- …` has no precedent in this
        # repository and would risk vitest reading what follows `--` as
        # positional arguments, which selects the wrong cases WITHOUT
        # erroring -- and a green step for that reason is the one outcome
        # that would make us withdraw a correct report.
        #
        # The WHOLE file, with no `-t`. A `-t minimal` filter was tried first
        # and run 35449457652 measured what it did: `7 tests | 6 skipped`. It
        # selected ONE case -- `boots the standalone minimal profile through
        # its generated manifest`, 1479 ms -- and that is the one case here
        # that never drives a tool call and therefore cannot answer this
        # entry's question. The case that can, `executes the documented editor
        # opt-in patch with sdk-minimal`, was among the skipped. The step was
        # green, in four seconds, having run the only case incapable of
        # failing for the reason it was added.
        #
        # Why that one and not its sibling IS established (lane A, reading
        # vitest 4.1.8): `-t` matches the FORMATTED title, `$label` goes
        # through `objDisplay` (`@vitest/runner` chunk-artifact.js:964, :2197),
        # this repository configures no truncation limit, so the default 40
        # applies (display.js:752-755) and a string label renders as a quote
        # plus its first 37 characters plus an ellipsis. "minimal" sits at
        # characters 52-59 of the editor case's label and is cut away; in the
        # boots case it sits at 22-28 and survives.
        #
        # The filter is deleted rather than repaired, because the defect is not
        # which cases it picked: a step that reports success having silently
        # skipped the observation it exists for is the failure this program
        # keeps recording, and one less mechanism is worth more than a better
        # pattern plus an assertion to maintain.
        #
        # Seven cases instead of two, and the extra five earn their time: four
        # boot `--profile sdk`, which layers over base and carries a policy
        # engine, so they are the launcher's own positive control -- if THEY go
        # red the problem is the launcher, not the policy. The one case that
        # answers this entry's question is `executes the documented editor
        # opt-in patch with sdk-minimal`: it drives `str_replace_editor` through
        # a real turn and asserts the tool BODY ran by reading the file back.
        # Its `sdk-minimal` sibling never drives a tool call and would pass on a
        # profile that refuses everything, which is what makes the pair
        # diagnostic.
        #
        # Keyless: the child gets a placeholder `DEEPSEEK_API_KEY` and a
        # `DEEPSEEK_BASE_URL` pointing at a local server standing in for the
        # model, so no credential and no network egress are involved, and
        # nothing in this file self-skips. It is a step of its own rather than
        # a copy of `e2e.yml`'s job, whose job-level secret preflight would
        # exit 1 for the whole job.
        #
        # It landed EXPECTING RED, and the red it expected is gone:
        # BLOCKED-266 had the shipped `sdk-minimal` refusing every tool call
        # with `policy-unavailable`, this step observed it, and BLOCKED-285 is
        # now FIXED (`BLOCKED-QUEUE.md:7708`) -- step 22 of run 35465390168
        # came back success. The reds since are a different case in the same
        # file: in 35467913630, 35470518835 and 35475180584 the only failure
        # is BLOCKED-291's SDK control, which waited out its deadline on a
        # turn the server had refused -- `afac505e1b` is meant to stop it
        # doing that, and no run has observed that yet. 35473161135 is not
        # that shape at all: five of this file's cases failed there, four of
        # them launcher-booting cases with nothing to do with identity,
        # because the type error stopped `tsc -b`, `lib/typert.host.js` was
        # never emitted and no launcher could boot. So a red here is a finding
        # to read rather than a standing condition -- read WHICH case failed
        # from the report, since one step covers the whole file. No
        # `continue-on-error`: a red that
        # does not show is not an observation. `vitest.e2e.config.ts` sets
        # `retry: 2`, so a failing case runs three times before the step
        # settles.
        #
        # The json reporter writes this step's report beside the full-suite
        # one, and the observation upload after the e2e steps carries it. The
        # full-suite run uses the default config, which includes no `*.e2e.ts`
        # file, so an entry frozen under `vitest.e2e.config.ts` is observed by
        # its e2e step's report alone. `default` keeps the log readable, as in
        # the suite step.
        run: |
          pnpm exec vitest run --config vitest.e2e.config.ts \
            apps/cli/tests/profiles/sdk/keyless-smoke.e2e.ts \
            --reporter=json --outputFile=.artifacts/first100/observations/vitest-e2e-sdk-keyless-smoke.json --reporter=default

      - name: BLOCKED-291 — the ACP launcher's own identity attribution
        if: always()
        # The ACP half of BLOCKED-291's unlock condition (a). `acp.e2e.ts` runs
        # in NO workflow this program observes: `e2e.yml` would reach it through
        # `pnpm run test:e2e`, but that workflow triggers on `push: [main,
        # master]`, `pull_request`, `schedule` and `workflow_dispatch`, none of
        # which fire on the fork branch this program works on -- the same blind
        # spot recorded for `ci.yml` below. Without this step the ACP case
        # would be written, correct, and never observed.
        #
        # Keyless: the case starts a loopback stand-in model endpoint and points
        # the child at it with `DEEPSEEK_BASE_URL`, alongside the placeholder
        # `DEEPSEEK_API_KEY` the adapter checks for at apply time. The file's
        # key-gated describe self-skips, which is why the whole file is safe to
        # run here.
        #
        # The WHOLE file, with no `-t`, for the reason the step above records at
        # length: a `-t` filter matches the FORMATTED title and silently selects
        # the wrong cases.
        #
        # Expected GREEN, and since `a816deb892` it is the UNLOCK evidence
        # rather than the negative control: the case now asserts P2-01
        # acceptance[0] -- the first `action/manifest-appended` names the host
        # user and exactly one `identity/attached` is logged. The negative
        # control it replaced is on record in this step's own earlier runs,
        # where the same case, in the same step, asserted `anonymous:` and zero
        # attachments and came back green: step 23 of runs 35467913630
        # (`b60ee70488`), 35470518835 (`6705631da3`) and 35475180584
        # (`d034e34839`). Its one red, 35473161135 (`6f1c52ef64`), was the
        # type error that stopped `tsc -b` before any launcher booted. That is
        # what makes this green an observation of the fix and not of a case
        # written to pass.
        #
        # Its json report goes beside the full-suite one for the reason the
        # step above gives. P4-05.U.4's frozen argv is this step's command
        # without the two reporters.
        run: |
          pnpm exec vitest run --config vitest.e2e.config.ts \
            apps/cli/tests/profiles/acp/tests/acp.e2e.ts \
            --reporter=json --outputFile=.artifacts/first100/observations/vitest-e2e-acp.json --reporter=default

      - name: Workflow runs on shipped launches — a detached run (BLOCKED-323, BLOCKED-324) and a resumed one (P4-08)
        if: always()
        # Keyless: stand-in models answer every request. Each frozen entry
        # (P2-01.U.2, P2-01.U.3, and P4-08's resume case) is this step's
        # command for its one file, without the two reporters; this report is
        # their observation, for the reason the sdk step above gives.
        run: |
          pnpm exec vitest run --config vitest.e2e.config.ts \
            apps/cli/tests/profiles/headless/tests/detached-workflow-exit.e2e.ts \
            apps/cli/tests/profiles/headless/tests/detached-workflow-cwd.e2e.ts \
            apps/cli/tests/profiles/acp/tests/workflow-resume.e2e.ts \
            --reporter=json --outputFile=.artifacts/first100/observations/vitest-e2e-workflow.json --reporter=default

      - name: Publication and package hygiene
        if: always()
        # BLOCKED-210. Fifteen gates this program never saw. `pnpm run hygiene`
        # runs in no workflow; `verify-runtime-closure` and
        # `verify-package-invariants` are in no CI gate set at all; `publint` is
        # wired into ci-primary/ci-consumers/ci-artifacts, but `ci.yml` triggers
        # on `pull_request` only and this program works on a fork branch that
        # never fires it. So the one signal this program consumes was blind to
        # all fifteen -- the same shape as BLOCKED-204's `*.e2e.ts` corpus, and
        # how BLOCKED-207 shipped a package whose two entry points both import a
        # chunk `files[]` did not publish.
        #
        # AFTER Build, and this position is load-bearing rather than
        # conventional. `publicationFiles` globs each package's `files[]`
        # patterns against the real directory, so with no `lib/` the closure
        # check has no JS to scan and reports nothing -- measured on a clean
        # unbuilt worktree: 0 `does not publish` lines, the exact check that
        # caught BLOCKED-207 sitting silent. The gate still goes red there, on
        # publint's own `FILE_DOES_NOT_EXIST` errors (four per package across
        # all 291: `pkg.main`, `pkg.types`, `pkg.exports["."].default`,
        # `.types`), which is 1164 lines saying only "you forgot to build".
        # That second instrument is what makes the first one's silence
        # survivable, and it is a dependency on publint@0.3.21's current
        # behaviour: if a later version stops reporting missing entry files,
        # this reasoning must be re-measured rather than assumed.
        env:
          # A failing gate aborts its running siblings, as in ci.yml: the
          # remaining readers tell a reader nothing once one of them is red.
          DSH_GATE_FAIL_FAST: '1'
        run: pnpm run hygiene

      - name: Lint the files this program changed since the frozen baseline
        if: always()
        # BLOCKED-109, as re-adjudicated once the real numbers were known. Lint
        # entered this gate for a diagnostic reason: a First-100 commit that
        # fails lint has not been through the branch's own gate, and that
        # shortcut is the shape every failure of 2026-09-07 shared. The reason
        # is about THIS PROGRAM's commits, so the gate now asks about them.
        #
        # Whole-tree lint asked a different question and answered it badly:
        # ~56 type-aware errors sit in packages/client/ui-chat and
        # ui-conversation, last touched before the baseline and unrelated to any
        # cell's correctness. Blocking every cell on them would make this
        # program pay another's debt while wearing the costume of rigour.
        #
        # The set is mechanical, not a maintained allowlist: every source file
        # differing from `frozenBaseline`. A First-100 commit that touches a file
        # carrying old debt pulls that file in and must leave it clean — you
        # touched it, it leaves your hands clean.
        #
        # Runs after Build because the type-aware rules read emitted types;
        # `build:lib:host` alone emits the host face and would resolve every
        # client type to `error`.
        #
        # Policy (BASE-ALIGN-v3): the changed-file lint gates files THIS PROGRAM
        # authored relative to the re-anchor upstream. A file byte-identical to that
        # upstream was adopted verbatim; its lint state is upstream's responsibility.
        # Touch it -> its blob differs -> it re-enters the gate. REANCHOR_UPSTREAM below
        # is the current re-anchor upstream SHA and MUST be updated on the next
        # re-anchor -- the symptom of a stale value is a burst of reds in files this
        # program never touched.
        env:
          REANCHOR_UPSTREAM: ${{ github.event.inputs.reanchor_upstream || 'c291e7961a515f6d7af9304e7fd1d257929aef26' }}
        run: |
          base=$(node -e "process.stdout.write(require('./tests/first100/registry.json').frozenBaseline.sha)")
          echo "frozen baseline: $base"
          mapfile -t changed < <(git diff --name-only --diff-filter=d "$base..HEAD" -- '*.ts' '*.tsx' '*.mjs' | grep -v '^vendor/' || true)
          if [ -n "$REANCHOR_UPSTREAM" ]; then
            echo "re-anchor upstream: $REANCHOR_UPSTREAM"
            kept=()
            for f in "${changed[@]}"; do
              tipblob=$(git rev-parse --verify -q "HEAD:$f" || echo -)
              upblob=$(git rev-parse --verify -q "$REANCHOR_UPSTREAM:$f" || echo =)
              [ "$tipblob" = "$upblob" ] || kept+=("$f")
            done
            changed=("${kept[@]}")
          fi
          echo "${#changed[@]} changed source file(s) to lint (upstream-verbatim excluded when re-anchoring)"
          if [ "${#changed[@]}" -eq 0 ]; then echo "nothing this program changed; lint has no subject"; exit 0; fi
          pnpm exec tsx scripts/run-oxlint.ts "${changed[@]}"

      # §12.71: the other half of running snapshots in `lib` mode. That mode
      # includes `apps/web/tests/**/*.snapshot.ts`, and those scenarios launch
      # a real browser — without this the run fails with
      # `browserType.launch: Executable doesn't exist at
      # ~/.cache/ms-playwright/chromium_headless_shell-…`, which reads as a
      # snapshot regression and is a missing dependency. Chromium only, and
      # the cache key matches `ci.yml`'s so the two share one warm cache.
      #
      # `if: always()` on BOTH, because the step that needs them has it. Without
      # it an earlier red — a lint failure, say — skips these two while the
      # snapshot step still runs, and the browser it needs is simply absent. The
      # run then reports a snapshot regression that is really a skipped install,
      # which is the most expensive kind of wrong answer an observation can give:
      # it looks like evidence about the code.
      - uses: actions/cache/restore@v4
        if: always()
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium and hosted dependencies
        if: always()
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      - name: Recorded-session snapshots
        if: always()
        # BLOCKED-109: snapshots are tests. A cell greened while 76 of them are
        # red says less than it appears to, and P2-03's U stage is the worked
        # example -- it broke 76 and every cell greened anyway. Keyless replay,
        # so this needs no credentials.
        #
        # BLOCKED-137: a refresh that could not observe some scenarios leaves
        # `snapshots/.refresh-skipped.json` naming them. Printing it BEFORE the
        # run turns "expected 0 to be 1 in pwsh-tool-turn" into "that fixture is
        # known stale on the host that refreshed it" -- the diagnosis that took
        # five red runs to reach by hand.
        #
        # §12.65: `lib` mode, matching `snapshotGate()` in scripts/run-gates.ts.
        # The web scenarios live in `apps/web/tests/**/*.snapshot.ts`, which the
        # runner includes ONLY under this mode because they execute generated
        # client bundles; source mode is the zero-build path. Without it this
        # workflow observed 4 files and the main `ci.yml` observed 6, and since
        # `ci.yml` does not run on the fork branch, the web corpus was invisible
        # to every signal this program consumes -- which is how
        # `snapshots/web/minimal-preset` sat stale from P2-03's manifest work
        # until a local lib-mode run found it. The Build step above is the
        # prerequisite this mode needs.
        #
        # The command is `pnpm run test:snapshot`'s own, with the json reporter
        # added as in the suite step: an entry frozen under
        # `vitest.snapshot.config.ts` is observed by this report, since the
        # full-suite run includes no snapshot file.
        env:
          DSH_EXAMPLE_MODE: lib
        run: |
          if [ -f snapshots/.refresh-skipped.json ]; then
            echo "::warning::a refresh left fixtures unobserved; a failure in one of these is stale-on-host, not a regression:"
            cat snapshots/.refresh-skipped.json
            echo "refresh them where they run (pwsh scenarios need a real pwsh), then delete the record"
          fi
          pnpm exec vitest run --config vitest.snapshot.config.ts \
            --reporter=json --outputFile=.artifacts/first100/observations/vitest-snapshot.json --reporter=default

      # After every step that writes a report, so the artifact carries the
      # e2e and snapshot reports beside the full-suite one.
      # `if-no-files-found` applies to the paths together, so one missing
      # report does not fail this step: a step whose report is missing has
      # failed on its own, and the uniqueness step below fails when the
      # full-suite report is missing.
      - name: Upload the vitest observation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first100-vitest-report-${{ steps.resolve-sha.outputs.sha }}
          path: |
            .artifacts/first100/observations/vitest-report.json
            .artifacts/first100/observations/vitest-e2e-sdk-keyless-smoke.json
            .artifacts/first100/observations/vitest-e2e-acp.json
            .artifacts/first100/observations/vitest-e2e-workflow.json
            .artifacts/first100/observations/vitest-snapshot.json
          if-no-files-found: error

      # This step asks a question the suite cannot: a frozen title no test can
      # produce is invisible to a run — the case simply is not there, and the
      # observation is silent about it. Deleting a frozen case without
      # superseding its entry happened twice in one day, both times caught by a
      # person reading. `vitest list` collects without executing, under the
      # default config, which includes no `*.e2e.ts` or `*.snapshot.ts` file;
      # so this runs after the e2e and snapshot steps and reads each report
      # they wrote for the titles an entry froze under their configs
      # (P4-05.U.4).
      - name: Every live frozen case title exists in the tree
        # `always()` for the suite's reason: a red step earlier in the job
        # should cost one round, not this verdict.
        if: always()
        run: |
          pnpm run first100:verify-frozen-titles-in-tree \
            --e2e-report .artifacts/first100/observations/vitest-e2e-sdk-keyless-smoke.json \
            --e2e-report .artifacts/first100/observations/vitest-e2e-acp.json \
            --e2e-report .artifacts/first100/observations/vitest-e2e-workflow.json \
            --e2e-report .artifacts/first100/observations/vitest-snapshot.json

      - name: Frozen case strings are unique across the whole suite
        # Here and not in the registry gate set: it needs the whole-suite report
        # the suite step writes, which does not exist when the gate set runs,
        # and after the e2e and snapshot steps, whose reports count the strings
        # of the entries frozen under their configs (P4-05.U.4).
        # `always()` for the suite's reason: a precondition failing upstream
        # should cost one round, not this verdict.
        # verify-freeze-case-uniqueness refuses a report whose parent directory
        # carries no commit token (reportDirMatchesCandidate), so every report
        # is checked from a copy in a directory named like the uploaded
        # artifact. A report its step did not write is not copied, and the gate
        # refuses that --e2e-report by its path.
        if: always()
        run: |
          d=.artifacts/first100/observations/first100-vitest-report-${{ steps.resolve-sha.outputs.sha }}
          src=.artifacts/first100/observations/vitest-report.json
          [ -f "$src" ] || { echo "verify-freeze-case-uniqueness: cannot decide — --report $src does not exist" >&2; exit 2; }
          mkdir -p "$d"
          cp "$src" "$d/"
          for own in .artifacts/first100/observations/vitest-e2e-*.json .artifacts/first100/observations/vitest-snapshot.json; do
            if [ -f "$own" ]; then cp "$own" "$d/"; fi
          done
          node scripts/first100/verify-freeze-case-uniqueness.mjs --report "$d/vitest-report.json" \
            --e2e-report "$d/vitest-e2e-sdk-keyless-smoke.json" \
            --e2e-report "$d/vitest-e2e-acp.json" \
            --e2e-report "$d/vitest-e2e-workflow.json" \
            --e2e-report "$d/vitest-snapshot.json" \
            --candidate-sha ${{ steps.resolve-sha.outputs.sha }}


      - name: Pack the dsh family
        if: always()
        run: pnpm run release:pack --family dsh

      - name: Pack the vendor family
        if: always()
        run: pnpm run release:pack --family vendor --out dist/npm-vendor

      - name: Verify packed install (throwaway consumer, real npm install + entry probe)
        if: always()
        id: verify-packed-install
        run: pnpm run release:verify-packed-install --family dsh --from dist/npm --from dist/npm-vendor

  python-sdk:
    name: First-100 keyless Python SDK suite @ exact SHA
    runs-on: ubuntu-latest
    needs: exact-sha-gate
    # `needs: exact-sha-gate` for the resolved candidate SHA, which means this
    # job STARTS AFTER that one rather than beside it. That is the trade taken
    # knowingly: re-resolving the SHA here would be a second answer to "which
    # commit is this run about", and two answers is exactly what the resolve
    # step's own comment refuses. The wait costs wall-clock; a divergent
    # candidate would cost the observation.
    #
    # The Python half of the SDK has never been observed by this program:
    # `ci.yml:430-447`
    # is the only place it runs, and that workflow triggers on `pull_request`,
    # which a fork branch never fires. So the TypeScript side of every SDK
    # change has been checked and the Python side has been read — the same
    # shape as BLOCKED-285's packaged half, and the reason this job exists.
    #
    # `always()` for the reason the suite step has it: a precondition failing
    # in the other job should cost one round, not this observation.
    # `always()` runs a job whose dependency was SKIPPED, not only one whose
    # dependency failed, so a narrow run needs saying again here: without it
    # this job would run against a candidate SHA the gate never resolved.
    if: ${{ always() && !inputs.narrow_test && !inputs.narrow_python }}
    permissions:
      contents: read
    steps:
      # The SAME resolved candidate, never the branch name: every artifact this
      # program records binds to that exact value, and a job that checked out a
      # ref could observe a different tree than the one being reported on.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.exact-sha-gate.outputs.candidate-sha }}
          persist-credentials: false

      # Versions pinned as `ci.yml` pins them, so the two jobs cannot drift
      # into observing different toolchains and calling it the same suite.
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
          cache: pip

      - name: Install uv
        run: python -m pip install uv==0.11.23

      # Keyless and self-contained: `test_client.py` drives a FAKE dsh — a
      # Python script that prints JSON-RPC — rather than launching the real
      # binary, and the script-level tests execute repo scripts through
      # `runpy`. Nothing here needs node, pnpm, a build, or a credential. Two
      # files self-skip when no bundled runtime is present, which is the case
      # they are about rather than a silently emptied suite.
      #
      # No `continue-on-error`: the point is to observe this half, and a red
      # that does not show is not an observation. `-rA` prints a summary line
      # for every case, PASSED included, so the log names the Python cases a
      # sign-off cites; it changes what is reported, not what passes.
      - name: Run complete keyless Python suite
        run: uv run --python 3.10 --group test --project python/sdk pytest -rA

  narrow-python:
    name: narrow keyless Python SDK suite @ exact SHA
    runs-on: ubuntu-latest
    # The Python counterpart of `narrow-test`: whether one mutation reddens the
    # named cases, answered without the gate. `-rA` names every case's outcome
    # in the log and the JUnit report carries them as data, so a green run says
    # which cases ran, which the gate job's one "N passed" line does not. Not a
    # ledger observation: the gate's `python-sdk` job is.
    if: ${{ inputs.narrow_python }}
    permissions:
      contents: read
    steps:
      - name: Require an explicit candidate SHA
        id: sha
        env:
          REQUESTED_SHA: ${{ github.event.inputs.sha }}
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "narrow-python: pass an explicit 40-hex \`sha\` input; this job has no fallback" >&2
            exit 2
          fi
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false

      - name: Verify checkout landed on the requested SHA
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "${{ steps.sha.outputs.sha }}" ]; then
            echo "::error::checked out $actual, requested ${{ steps.sha.outputs.sha }}"
            exit 1
          fi

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
          cache: pip

      - name: Install uv
        run: python -m pip install uv==0.11.23

      - name: Run the keyless Python suite, naming every case
        run: uv run --python 3.10 --group test --project python/sdk pytest -rA --junitxml=python-junit.xml

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narrow-python-junit-${{ steps.sha.outputs.sha }}
          path: python-junit.xml
          if-no-files-found: error

  narrow-test:
    name: narrow vitest run @ exact SHA
    runs-on: ubuntu-latest
    # A job of its own rather than a branch inside the gate, for the reason
    # `snapshot-refresh` is one: the gate's thirty steps are a fixed sequence
    # whose meaning comes from running together, and threading a condition
    # through them would make every future reader ask which of them a given
    # run actually did.
    #
    # What it exists for: a sensitivity proof asks whether ONE mutation reddens
    # ONE file's cases. The gate answers that in 35 minutes; this answers it in
    # a few, and the mutation never joins `first100-exec` -- it is pushed to a
    # `gate/*` branch, run here, read, and abandoned.
    #
    # `narrow-report-*` IS NOT A LEDGER OBSERVATION INPUT, and the usual reason
    # a narrow run exists is the reason why: it is normally run on a MUTATED
    # commit that must never reach `first100-exec`. Only the gate job's
    # candidate-SHA artifact may green a cell (`generate-ledger.mjs:12-17`,
    # maintainer decision A4/B7(1)); this artifact answers "did that mutation
    # redden those cases", which is a different question with a different
    # subject.
    if: ${{ inputs.narrow_test }}
    permissions:
      contents: read
    steps:
      - name: Require an explicit candidate SHA
        id: sha
        # Same rule as `snapshot-refresh`, and for the same reason: a report
        # that cannot be placed against a commit is not evidence. The input
        # arrives through `env` rather than a `${{ }}` expansion, so the
        # pattern below tests a string that could not have ended the statement
        # meant to validate it.
        env:
          REQUESTED_SHA: ${{ github.event.inputs.sha }}
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "narrow-test: pass an explicit 40-hex \`sha\` input; this job has no fallback" >&2
            exit 2
          fi
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

      # No `fetch-depth: 0`. The gate job takes full history because
      # `verify-baseline-file-references` resolves a commit other than HEAD;
      # this job runs vitest over paths and asks git nothing beyond the
      # checkout itself, and a narrow run exists to be fast.
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false

      - name: Verify checkout landed on the requested SHA
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "${{ steps.sha.outputs.sha }}" ]; then
            echo "::error::checked out $actual, requested ${{ steps.sha.outputs.sha }}"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The two prerequisites a vitest run needs whatever it selects: a sandbox
      # backend, without which confined commands are refused and the scenarios
      # that exercise them record the refusal; and the native addon, because
      # these steps call vitest directly rather than through a script that
      # builds it first.
      - name: Install a sandbox backend (bubblewrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            echo "AppArmor userns restriction present; lifting it for this runner"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "no kernel.apparmor_restrict_unprivileged_userns on this kernel; leaving sysctls alone"
          fi
          pnpm exec tsx scripts/probe-sandbox-backend.ts

      - name: Build the host native-system addon
        run: pnpm run build:native-system

      # Opt-in, because most narrow runs select source-lane paths and a build
      # is the single most expensive step here. A path that executes built
      # `lib/` needs it and says so through the input.
      - name: Build (official client profile)
        if: ${{ inputs.narrow_build }}
        env:
          DSH_BUILD_CLIENT_PROFILE: official
        run: pnpm run build

      # The path arrives through `env`, never interpolated into the script: an
      # expansion is substituted before bash parses the line, so a crafted
      # input could otherwise end the command it was meant to be an argument
      # to. Unquoted on purpose so several paths can be passed as one input --
      # vitest takes them as separate filters.
      - name: Narrow vitest run
        env:
          NARROW_PATHS: ${{ inputs.narrow_test }}
        run: |
          # shellcheck disable=SC2086
          pnpm exec vitest run $NARROW_PATHS --reporter=json --outputFile=narrow-report.json

      # `if: always()` so a RED run still hands back its report -- a sensitivity
      # proof is a question whose expected answer is red, and a job that
      # withholds the report on red answers nothing.
      - name: Upload the narrow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narrow-report-${{ steps.sha.outputs.sha }}
          path: narrow-report.json
          if-no-files-found: error

  snapshot-refresh:
    name: Recorded-session REFRESH (artifact only, never committed)
    runs-on: ubuntu-latest
    # No `needs`: a refresh is asked for on its own and must not wait behind a
    # full gate, and a red gate must not withhold the fixtures it would produce.
    #
    # The cost of standing alone is that this job cannot read the gate's
    # resolved SHA, and re-deriving one here would be a SECOND answer to "which
    # commit is this run about" -- exactly what the gate's own resolve step
    # refuses. So this job does not derive one at all: it requires the caller to
    # say, and fails when they do not. `github.sha` is deliberately not a
    # fallback, because a refresh that silently rewrote fixtures from the branch
    # tip instead of the candidate would hand back an artifact nobody could
    # place.
    if: ${{ inputs.refresh_snapshots }}
    permissions:
      contents: read
    steps:
      - name: Require an explicit candidate SHA
        id: sha
        # The input arrives through `env`, never interpolated into the script:
        # a `${{ }}` expansion is substituted BEFORE bash parses the line, so
        # the pattern test below would be checking a string that had already
        # been able to end the statement it was meant to validate.
        env:
          REQUESTED_SHA: ${{ github.event.inputs.sha }}
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "snapshot-refresh: pass an explicit 40-hex \`sha\` input; this job has no fallback" >&2
            exit 2
          fi
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false

      # The step above REQUESTED a SHA; this one is what makes the artifact
      # placeable. The job already refuses to guess a candidate, for the reason
      # its own comment gives -- a refresh that rewrote fixtures from somewhere
      # else hands back an artifact nobody can place -- and that guarantee is
      # only as good as the checkout actually landing where it was told.
      - name: Verify checkout landed on the requested SHA
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "${{ steps.sha.outputs.sha }}" ]; then
            echo "::error::checked out $actual, requested ${{ steps.sha.outputs.sha }}"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The recording host had one and this host must too. Without it
      # `dsh-sandbox-local` refuses to run a confined command -- the right
      # product behaviour -- and the sandboxed-bash scenarios record that
      # refusal AS THE FIXTURE. Run 35467913630 did exactly that to
      # `snapshots/sdk/bash-tool`: the tool result came back as `Error: sandbox
      # mode "workspace-write" is requested but no sandbox backend`, and a
      # reviewer applying that patch would have committed it.
      #
      # After `Install (immutable)` for the gate job's reason: the probe runs
      # through tsx from node_modules, so running it earlier fails on a missing
      # dependency and reports that as a sandbox-capability failure.
      - name: Install a sandbox backend (bubblewrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            echo "AppArmor userns restriction present; lifting it for this runner"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "no kernel.apparmor_restrict_unprivileged_userns on this kernel; leaving sysctls alone"
          fi
          pnpm exec tsx scripts/probe-sandbox-backend.ts

      # The gate job's reason for this step applies here word for word: "these
      # steps call vitest directly, so the build has to precede the first of
      # them". The refresh calls vitest directly too.
      - name: Build the host native-system addon
        run: pnpm run build:native-system

      # The same build the gate job runs before ITS recorded-session step, and
      # for the same reason: `snapshots/**` scenarios load generated host
      # artifacts -- `lib/typert.host.js` among them -- which only a build
      # produces. Run 35465390168 is the worked example: without this step 110
      # of 137 scenarios died at load with `ERR_MODULE_NOT_FOUND` on that
      # file, and the job still reported success.
      #
      # The comment this replaces said "SOURCE mode, so no build step", which
      # confused two different questions. Source mode decides WHICH CORPORA
      # run: `vitest.snapshot.config.ts` includes `apps/web/tests/**` only
      # under `DSH_EXAMPLE_MODE=lib`, so **this run still does NOT refresh the
      # web corpus**. It never decided whether the harness's own build output
      # has to exist, and it does.
      #
      # `assertBuiltArtifactsCurrent` did not catch this: it skips a package
      # whose `lib/` is absent (`built-artifacts.ts:74`), so it guards against
      # a STALE build and is blind to NO build.
      - name: Build (official client profile, as the gate job's snapshot step needs)
        env:
          DSH_BUILD_CLIENT_PROFILE: official
        run: pnpm run build

      # Replay, so no credentials: `record` is the mode that needs a key.
      #
      # The log is teed so the collect step can report the refresh's OWN counts.
      # Without them an empty `fixtures.patch` has two readings -- nothing
      # drifted, or nothing ran -- and this channel's first observation was the
      # second one misread as the first.
      - name: Refresh recorded fixtures
        run: |
          set -o pipefail
          pnpm run test:snapshot:refresh 2>&1 | tee "$RUNNER_TEMP/refresh.log"

      # Everything the reviewer needs to judge and apply the result, and
      # nothing that commits it. The patch is `--binary` because a refreshed
      # corpus can carry non-text fixtures, and `git status --porcelain` is
      # captured beside it so a reviewer can see added and removed files, which
      # a patch alone makes them reconstruct.
      #
      # `.refresh-skipped.json` rides along when the refresh could not observe
      # some scenarios on this host -- the pwsh fixtures are the standing
      # example. It is NOT committed with the fixtures: it describes this run,
      # and a stale copy in the tree would turn "this host could not refresh
      # these" into a claim about the tree.
      # OUTSIDE the working tree, under the runner's temp dir. Collecting into
      # the repository would put this step's own output into the very diff it
      # is capturing: `git add -A` stages everything untracked, so a
      # `refresh-out/` written first lands in `fixtures.patch` and the reviewer
      # applies a patch that recreates the report next to the fixtures.
      - name: Collect the refresh output
        if: always()
        env:
          OUT: ${{ runner.temp }}/refresh-out
        run: |
          mkdir -p "$OUT"
          git status --porcelain > "$OUT/status.txt"

          # The refresh's own result, so a reviewer can tell "nothing drifted"
          # from "nothing ran". Colour codes are stripped because the summary
          # lines carry them and a reader should not have to.
          if [ -f "$RUNNER_TEMP/refresh.log" ]; then
            sed -e 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/refresh.log" > "$OUT/refresh.log"
            grep -E '^ *(Test Files|Tests|Duration) ' "$OUT/refresh.log" > "$OUT/refresh-counts.txt" \
              || echo 'the refresh log reached no vitest summary line' > "$OUT/refresh-counts.txt"
          else
            echo 'the refresh step produced no log' > "$OUT/refresh-counts.txt"
          fi

          # Taken BEFORE staging, because the next line deliberately leaves it
          # out of the patch. `.refresh-skipped.json` is not gitignored, so a
          # bare `git add -A` would sweep it in and the reviewer would apply a
          # patch that commits a record of THIS RUN'S HOST into the tree --
          # "these scenarios could not be refreshed here" reads as a claim
          # about the repository once it is committed.
          if [ -f snapshots/.refresh-skipped.json ]; then
            cp snapshots/.refresh-skipped.json "$OUT/refresh-skipped.json"
          fi

          # `git diff` sees tracked files only, and a refresh can CREATE a
          # fixture -- a new scenario file would appear in status.txt as `??`
          # and contribute no bytes to the patch, so the reviewer would apply a
          # patch that silently omits it. Staging first puts new files in the
          # diff. This touches the runner's index only; nothing is committed.
          #
          # The exclusion is a pathspec rather than a later `restore --staged`,
          # so the one command that decides what enters the patch also states
          # what does not.
          git add -A -- . ':(exclude)snapshots/.refresh-skipped.json'
          git diff --cached --binary > "$OUT/fixtures.patch"

          # The control for the two lines above, run here rather than left to
          # whoever reviews the artifact: the skipped record must reach the
          # artifact AND be absent from the patch. Asserting it in-band is what
          # makes the first dispatch prove the mechanism instead of the
          # mechanism being taken on faith -- and if a future `git add`
          # rewrite drops the exclusion, this step goes red rather than the
          # patch quietly gaining a file.
          if [ -f "$OUT/refresh-skipped.json" ] && grep -q 'refresh-skipped\.json' "$OUT/fixtures.patch"; then
            echo "snapshot-refresh: the skipped record leaked into fixtures.patch; the add-exclusion above is not holding" >&2
            exit 1
          fi

      # The channel's self-check, and it is deliberately a step of its own so
      # its verdict is not buried in the collection.
      #
      # On a tree whose corpora are already current the refresh should rewrite
      # nothing but clocks. Anything else means this host differed from the one
      # that recorded, and the patch must not be applied -- run 35467913630 is
      # the case it exists for, where a missing sandbox backend rewrote two
      # fixtures' tool results into an error string.
      #
      # `if: always()` so a failed refresh still gets classified, and it runs
      # AFTER the collection so the artifact carries the report either way.
      # Clock drift is reported and does not fail: whether the writer oracles
      # should be carrying wall clocks at all is a separate question, and this
      # step must not quietly decide it.
      #
      # A RE-RECORD round is red here by design. A refresh that follows a real
      # product change rewrites payloads on purpose, and this step cannot tell
      # that from a host mismatch -- it answers "did this host record what the
      # last one did", asked of a tree that should already be current. On a
      # re-record dispatch its red is the expected reading, not a blocker, and
      # the reviewer reads `drift-report.txt` to see that every OTHER-column
      # entry is one the change was meant to produce.
      - name: Classify the refresh drift
        if: always()
        env:
          OUT: ${{ runner.temp }}/refresh-out
        run: |
          pnpm exec tsx scripts/first100/refresh-drift-report.ts \
            "$OUT/fixtures.patch" "$OUT/drift-report.txt"

      - name: Hand the refresh out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-refresh-${{ steps.sha.outputs.sha }}
          path: ${{ runner.temp }}/refresh-out
          if-no-files-found: error

  first100-evidence:
    name: First-100 issue-runner dry + observation verify
    runs-on: ubuntu-latest
    needs: exact-sha-gate
    # Capturing the dry/verify evidence does not depend on the native test
    # suite passing — run it regardless of exact-sha-gate's outcome so a red
    # nativeTestFullSuite never silently hides runnerDryReceipt evidence too.
    # Same reason as `python-sdk`, and costlier if forgotten: this job UPLOADS
    # evidence, so beside a skipped gate it would publish an evidence bundle
    # for a run that gated nothing.
    if: ${{ always() && !inputs.narrow_test && !inputs.narrow_python }}
    permissions:
      contents: read
    env:
      # GitHub Actions does not allow the `secrets` context inside `if:`
      # conditionals; mirror it into a job-level env var so the signing
      # step below can gate on presence without referencing `secrets`
      # directly in an expression.
      HAS_SIGNING_KEY: ${{ secrets.DSH_FIRST100_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.exact-sha-gate.outputs.candidate-sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Create the observations directory
        run: mkdir -p .artifacts/first100/observations

      # B5 (decisions-approved.md): a RED (and later GREEN) per-slice observation
      # must be a SIGNED observation artifact at the exact candidate SHA. The
      # sibling exact-sha-gate job already produces the one artifact every
      # future slice's command-freeze.json entry is graded against (a repo-wide
      # `vitest --reporter=json` run — generate-ledger.mjs's cmdGreen greps this
      # same report for a frozen entry's expectCases regardless of how many
      # other files it also covers, so ONE signed report here services every
      # slice touched at this candidate SHA; C5 batches CI by push, not per-slice).
      # An entry frozen under its own vitest config is graded against its own
      # step's report instead, which the same artifact carries.
      - name: Download the vitest observation report
        uses: actions/download-artifact@v4
        with:
          name: first100-vitest-report-${{ needs.exact-sha-gate.outputs.candidate-sha }}
          path: .artifacts/first100/observations/

      # Every report the artifact carries is a ledger observation input, so each
      # is signed. `attest.ts --sign` takes one file and writes the signature into
      # it, so each has its own call, and a report that is not there fails the
      # step, as the full-suite report always has.
      - name: Sign the vitest observation reports with the GitHub-secret identity
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          DSH_FIRST100_SIGNING_KEY: ${{ secrets.DSH_FIRST100_SIGNING_KEY }}
        run: |
          node scripts/first100/attest.ts --sign .artifacts/first100/observations/vitest-report.json
          node scripts/first100/attest.ts --sign .artifacts/first100/observations/vitest-e2e-sdk-keyless-smoke.json
          node scripts/first100/attest.ts --sign .artifacts/first100/observations/vitest-e2e-acp.json
          node scripts/first100/attest.ts --sign .artifacts/first100/observations/vitest-e2e-workflow.json
          node scripts/first100/attest.ts --sign .artifacts/first100/observations/vitest-snapshot.json

      # Real, honest evidence for R0 exit gate item 4 (runnerDryReceipt):
      # currently expected to exit 1 while command-freeze.json is still
      # empty and the registry's fixtures{} template paths remain void
      # placeholders (maintainer decision B4e) — that failure IS the
      # correct, truthful state of the catalog right now, not a defect in
      # this workflow. `continue-on-error` keeps the receipt capturable
      # without turning it into a false-green gate.
      - name: Issue-runner dry-validate the 100-id catalog
        id: dry
        continue-on-error: true
        run: pnpm run first100:dry | tee .artifacts/first100/observations/dry-report.json

      - name: Verify any committed observations
        id: verify
        continue-on-error: true
        run: pnpm run first100:verify | tee .artifacts/first100/observations/verify-report.txt

      - name: Sign the dry/verify evidence bundle with the GitHub-secret identity
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          DSH_FIRST100_SIGNING_KEY: ${{ secrets.DSH_FIRST100_SIGNING_KEY }}
        run: |
          node -e "
            const fs = require('fs');
            const bundle = {
              schema: { name: 'first100-ci-evidence-bundle', version: 1 },
              candidateSha: '${{ needs.exact-sha-gate.outputs.candidate-sha }}',
              ciRunUrl: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              dryReportExitCode: ${{ steps.dry.outcome == 'success' && 0 || 1 }},
              verifyExitCode: ${{ steps.verify.outcome == 'success' && 0 || 1 }},
              capturedAtUtc: new Date().toISOString(),
            };
            fs.writeFileSync('.artifacts/first100/observations/evidence-bundle.json', JSON.stringify(bundle, null, 2) + '\n');
          "
          node scripts/first100/attest.ts --sign .artifacts/first100/observations/evidence-bundle.json

      - name: Upload First-100 evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first100-evidence-${{ needs.exact-sha-gate.outputs.candidate-sha }}
          path: .artifacts/first100/observations/
          if-no-files-found: warn
