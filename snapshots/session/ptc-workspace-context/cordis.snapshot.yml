# Keyless replay counterpart of ptc-workspace-context.cordis.yml. It adds
# PTC mode to the default filesystem suite and swaps in replay.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@deepseek-ai/dsh-tools'
  config:
    mode: ptc

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

# This scenario runs in an ALREADY-TRUSTED workspace. The grant exists so the
# scenario measures PTC workspace context rather than the trust boundary: without it the
# boundary refuses, the project's own instruction files never reach the model,
# and the recording measures the refusal instead. The boundary itself is
# covered by P1-07's own cases, which boot a shipped profile and grant nothing.
- id: workspace-trust-local
  config:
    grants:
      - path: !!js process.cwd()
        state: trusted-read
