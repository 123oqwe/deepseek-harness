# Workspace-context snapshot patch: keep project-root and user-global
# discovery inside the scenario's temporary cwd.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
    dshHome: !!js process.cwd() + '/.dsh'
    projectRootMarkers:
      - .dsh-project

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

# This scenario runs in an ALREADY-TRUSTED workspace. The grant exists so the
# scenario measures instruction composition rather than the trust boundary: without it the
# boundary refuses, the project's own instruction files never reach the model,
# and the recording measures the refusal instead. The boundary itself is
# covered by P1-07's own cases, which boot a shipped profile and grant nothing.
- id: workspace-trust-local
  config:
    grants:
      - path: !!js process.cwd()
        state: trusted-read
