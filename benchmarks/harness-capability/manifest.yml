# Harness capability benchmark (Epic P0-08), read by runner.ts through manifest.ts.
#
# Every trial of a keyless lane launches the shipped product (`dsh --profile headless`
# from source) with no model API but the benchmark's own: a replaying lane answers
# from the recording, an attacking lane from the stub model on a loopback port. Every
# standard metric a lane reports is computed from those trials or declared not
# applicable here, with the reason (question 18 (a), BLOCKED-325, BLOCKED-335).
# README.md describes the report.
schemaVersion: 2

# The recorded headless sessions, and the default composition's owner, whose
# cordis.yml, cordis.snapshot.yml and model.cordis.yml compose every replay the way
# snapshots/session/headless.snapshot.ts composes it.
recordings: snapshots/session
composition: snapshots/session/text-turn

# A product run still going after this long is killed and judged failed.
trialTimeoutMs: 60000

# token_cost prices each assistant message's recorded usage per million tokens.
# Prices change; a report states the source and the date they were read.
pricing:
  source: https://api-docs.deepseek.com/quick_start/pricing
  retrievedAt: '2026-09-28'
  currency: USD
  # The page gives a standard (peak) and a discounted off-peak price per model;
  # the table holds the standard ones.
  rate: standard (peak)
  # The page names deepseek-flash, the shipped default model, and deepseek-v4-pro;
  # the recordings request deepseek-v4-flash. README.md lists this as a known
  # limitation.
  assumption: deepseek-v4-flash is priced at the page's deepseek-flash row
  models:
    deepseek-flash: { inputCacheHit: 0.006, inputCacheMiss: 0.3, output: 1.2 }
    deepseek-v4-flash: { inputCacheHit: 0.006, inputCacheMiss: 0.3, output: 1.2 }
    deepseek-v4-pro: { inputCacheHit: 0.044, inputCacheMiss: 1.32, output: 3.96 }

lanes:
  - name: deterministic
    trials: 8
    # Recordings that replay unchanged and hold at least one tool result, so T1 has
    # something to compare. product.ts refuses a listed scenario that sets another
    # profile or composition, a replay override, a platform, a workspace check or a
    # pinned session format, or that has child sessions. Left out of the corpus as
    # well: bash-startup-timeout, whose outcome depends on timing, and recordings
    # with no tool result (pi-ai-replay-metadata, the invalid-matcher and
    # prompt-submit hook scenarios).
    scenarios:
      - bash-tool-turn
      - fs-read
      - fs-read-window
      - hook-cc-posttool-context
      - hook-cc-pretool-ask
      - hook-cc-pretool-deny
      - hook-codex-posttool-block
      - hook-codex-posttool-context
      - hook-codex-pretool-block
      - repeat-tool-reminder
      - todo-write
      - tool-call-turn
    notApplicable:
      policy_bypass: a replayed recording asks for nothing the policy refuses, so it has nothing to bypass; the security lane measures bypasses
      recovery_success: a replay injects no failure, so there is nothing to recover from; the fault lane measures recovery
      verification_precision: the shipped product has no verifier whose verdicts could be scored (BLOCKED-335)
      router_regret: the shipped product has no model router whose choices could be scored (BLOCKED-335)
    # No replayed recording stands on an open BLOCKED item.
    knownRedCheckedOn: '2026-09-28'
  - name: security
    # Each trial is one attack on the shipped headless composition with the stub
    # model (lanes/security.ts); five trials run every attack once, in the order
    # the run seed draws.
    trials: 5
    scenarios:
      - write-outside-workspace
      - shell-write-read-only
      - escalation-unanswered
      - expired-token-code-mode
      - terminal-run-same-batch
    notApplicable:
      recovery_success: an attack injects no failure, so there is nothing to recover from; the fault lane measures recovery
      verification_precision: the shipped product has no verifier whose verdicts could be scored (BLOCKED-335)
      router_regret: the shipped product has no model router whose choices could be scored (BLOCKED-335)
    # No attack stands on an open BLOCKED item: BLOCKED-331's fix is in the tree,
    # and an expired token is re-issued at the next dispatch, which is no attack;
    # its code-mode branch, which must still be refused, is expired-token-code-mode.
    knownRedCheckedOn: '2026-09-28'
  - name: fault
    # Each trial replays one recording that changes its workspace and injects one
    # failure at a model call its trial seed picks (lanes/fault.ts): alternately a
    # SIGKILL while the replay stalls, followed by a resume of the session, and a
    # retryable provider error. product.ts admits these recordings' final-workspace
    # check, which the lane makes against workspace.expected.
    trials: 6
    scenarios:
      - workspace-edit
      - fs-write
      - fs-write-overwrite
      - fs-edit
      - fs-delete-recreate
    notApplicable:
      policy_bypass: a replayed recording asks for nothing the policy refuses, so it has nothing to bypass; the security lane measures bypasses
      verification_precision: the shipped product has no verifier whose verdicts could be scored (BLOCKED-335)
      router_regret: the shipped product has no model router whose choices could be scored (BLOCKED-335)
    # No fault scenario stands on an open BLOCKED item.
    knownRedCheckedOn: '2026-09-28'
  - name: real-model
    # Needs a model API, so the keyless benchmark does not run it.
  - name: scale
    # No scenario yet.
