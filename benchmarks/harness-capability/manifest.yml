# Contract-stage manifest for the Harness capability benchmark framework (Epic P0-08).
#
# This file freezes the structural schema benchmarks/harness-capability/runner.ts (a later,
# U-stage slice -- not yet implemented) must satisfy once it starts executing lanes for real.
# tests/benchmark/runner.spec.ts is the source of truth for the frozen schema; see
# benchmarks/harness-capability/README.md for the human-readable contract.
#
# Frozen schema:
#   lanes: exactly 5 entries, name in {deterministic, fault, security, real-model, scale} (must[0])
#   lanes[].metrics: exactly the 8 standard metric names, no more, no fewer (must[1])
#   lanes[].reporting.confidenceInterval: true and lanes[].reporting.seedReplay: true (must[2])
#
# This file fully satisfies the frozen schema above -- tests/benchmark/runner.spec.ts's real
# js-yaml parse of this file passes must[0]-[2]. See benchmarks/harness-capability/README.md
# for the human-readable contract each lane and metric documents.

schemaVersion: 1

lanes:
  - name: deterministic
    metrics:
      - task_success
      - duplicate_side_effect
      - policy_bypass
      - recovery_success
      - verification_precision
      - router_regret
      - token_cost
      - latency
    reporting:
      confidenceInterval: true
      seedReplay: true

  - name: fault
    metrics:
      - task_success
      - duplicate_side_effect
      - policy_bypass
      - recovery_success
      - verification_precision
      - router_regret
      - token_cost
      - latency
    reporting:
      confidenceInterval: true
      seedReplay: true

  - name: security
    metrics:
      - task_success
      - duplicate_side_effect
      - policy_bypass
      - recovery_success
      - verification_precision
      - router_regret
      - token_cost
      - latency
    reporting:
      confidenceInterval: true
      seedReplay: true

  - name: real-model
    metrics:
      - task_success
      - duplicate_side_effect
      - policy_bypass
      - recovery_success
      - verification_precision
      - router_regret
      - token_cost
      - latency
    reporting:
      confidenceInterval: true
      seedReplay: true

  - name: scale
    metrics:
      - task_success
      - duplicate_side_effect
      - policy_bypass
      - recovery_success
      - verification_precision
      - router_regret
      - token_cost
      - latency
    reporting:
      confidenceInterval: true
      seedReplay: true
