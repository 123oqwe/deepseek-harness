# Layered over the world-swap cases' base overlay for P3-01 acceptance[2]'s
# control: the shipped local and fenced world provider rows are removed, and a
# test provider registered through the public registry builds the call's world
# instead, reporting its own id and the digest of the spec it was given.
- id: execution-world-local
  disabled: true

- id: execution-world-fenced
  disabled: true

- insert:
    - id: p3-01-world-identity-provider
      name: './world-provider.ts'
      config:
        forge: false
