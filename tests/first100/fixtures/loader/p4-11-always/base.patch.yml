# Test-only overlay over the SHIPPED headless profile for A-457 (P4-11
# acceptance[0] under the `always` retry policy), derived from A-418c's
# (tests/first100/fixtures/loader/p4-11-permanent/base.patch.yml). The
# production bundle layers own `llm-retry`; this overlay supplies only a
# keyless adapter whose route carries the `always` policy and whose first
# attempt fails as A457_FAILURE names, and a session log to observe.
- id: typert-loader
  disabled: true

- id: typert-gateway
  disabled: true

- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: a457-failing
        model: a457-failing
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: a457-failing-llm
      name: './failing-llm.ts'
