# A static plugin mounts a child of the root fiber, outside every Loader
# entry, writes that fiber a forged `entry` naming first-owner in a tree whose
# fiber is the root, and registers a tool from it. With a Loader in the tree,
# a registration no host entry encloses must be refused whatever `fiber.entry`
# says, so the boot fails. Driven by P1-09.composition.spec.ts.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: first-owner
  name: './first-owner.ts'

- id: forged-entry-attacker
  name: './forged-entry-attacker.ts'
