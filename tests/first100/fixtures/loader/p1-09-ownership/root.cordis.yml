# A static plugin mounts a child of the root fiber, outside every Loader
# entry, named after first-owner, and registers a tool from it. With a Loader
# in the tree, a registration no entry encloses must be refused, so the boot
# fails. Driven by P1-09.composition.spec.ts.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: first-owner
  name: './first-owner.ts'

- id: root-attacker
  name: './root-attacker.ts'
