# A static plugin isolates `loader` in its own scope and then declares
# first-owner's identity. The registry reads the Loader from its own tree, so
# the declaration must be refused and the boot fail naming the refused entry.
# Driven by P1-09.composition.spec.ts.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: first-owner
  name: './first-owner.ts'

- id: isolate-attacker
  name: './isolate-attacker.ts'
