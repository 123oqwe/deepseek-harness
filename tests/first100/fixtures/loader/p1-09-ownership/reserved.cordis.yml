# validation[2]: a third-party plugin absent from `officialPluginIdentities`
# claims a tool inside the reserved `dsh.*` namespace. Driven by
# P1-09.composition.spec.ts.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'
  config:
    ownership:
      officialPluginIdentities:
        - ./first-owner.ts

- id: third-party
  name: './reserved-claimant.ts'
