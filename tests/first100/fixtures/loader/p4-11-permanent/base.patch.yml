# Test-only overlay over the SHIPPED headless profile for BLOCKED-281 (b), the
# same mount the P4-11 mount slice observes
# (packages/reliability/retry-cockatiel/tests/fixtures/retry-mount.patch.yml).
# The production bundle layers own the retry budget and `llm-retry`; this
# overlay supplies only a keyless adapter whose first attempt fails as
# A418_FAILURE names, and a session log to observe.
- id: typert-loader
  disabled: true

- id: typert-gateway
  disabled: true

- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: a418-failing
        model: a418-failing
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: a418-failing-llm
      name: './failing-llm.ts'
