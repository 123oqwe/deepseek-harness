# Test-only overlay over the SHIPPED headless profile for A-385's
# measurement: what an approved tool call does when its Run was fenced or an
# emergency stop was raised while an operator was being asked about it. It
# supplies a keyless scripted model and an uncompressed session log, turns off
# the rows that would run a task of their own, and configures no agent: the
# driver creates the root agent after boot.
- id: typert-loader
  disabled: true

- id: typert-gateway
  disabled: true

- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: p4-07-ask-window-mock-llm
      name: './mock-llm.ts'
