# Test-only overlay over the SHIPPED headless profile for A-537 (BLOCKED-333
# latter half): the shutdown-settlement warn reaching stderr. The dsh-base
# layer owns every row this depends on (`subagent`, the `spawn` provider,
# `tool-subagent-control`, the durable `message-bus`, and `logger-stderr`,
# which writes plugin warnings to stderr); this overlay mounts none of them. It
# supplies a keyless scripted model and an uncompressed session log, turns off
# the rows that would run a task of their own, and configures no agent: the
# driver creates the parent after boot.
- id: typert-loader
  disabled: true

- id: typert-gateway
  disabled: true

- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: p5-10-shutdown-warn-mock-llm
      name: './mock-llm.ts'
