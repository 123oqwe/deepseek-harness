# The dsh-headless bundle patch: one-shot task mode directly over dsh-base.
# It mounts no Host, HTTP server, Web runtime, or browser plugin. An ordinary
# provider plugin injects `cmdlineArgs`, parses the task positional
# (`dsh --profile headless "<task>"`) and this app's --help, then the direct
# driver creates an Agent through the core registry and prints its durable result.

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: tools
  config:
    # Keep the same temporary process-wide PTC mode opt-in as the Web surface.
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # PTC mode is a core execution capability, not a Web component.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: headless-startup
      name: '@deepseek-ai/dsh-headless/startup'

    # Reads its task from the ordinary headlessStartup provider.
    - id: headless-runner
      name: '@deepseek-ai/dsh-headless'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task
        model: !!js ctx.headlessStartup.model
        outputFormat: !!js ctx.headlessStartup.outputFormat

# P1-07's project trust boundary, ENABLED here now that this profile has an
# unattended way to record a decision (BLOCKED-214's second half). It could not
# be enabled before: `askForReadTrustOnce` asks through `approval.request()`,
# which settles `'unavailable'` where no answerer is registered, and this
# profile registers none — so an enabled row would have refused every project
# permanently with no in-session way to grant.
#
# `dsh --trust-workspace[=read|execute|none]` is that way. It WRITES the durable
# record and nothing else: every Consumer still resolves trust through
# `stateFor` against a fresh identity observation, so a workspace trusted this
# way still loses trust when the directory is replaced, retargeted or moved.
# With no record and no answerer the boundary still refuses, which is the
# fail-closed direction it always had.
- id: workspace-trust-local
  disabled: false
- id: permission
  config:
    riskRules:
      - { domainTag: filesystem-read, riskClass: read }
      - { domainTag: catalog-read, riskClass: read }
      - { domainTag: session-state-read, riskClass: read }
      - { domainTag: process-observe, riskClass: read }
      - { domainTag: session-state-write, riskClass: local-reversible }
      - { domainTag: context-inject, riskClass: local-reversible }
      - { domainTag: filesystem-write, riskClass: internal-write }
      - { domainTag: shell-execute, riskClass: local-reversible }
      - { domainTag: process-control, riskClass: internal-write }
      - { domainTag: agent-spawn, riskClass: internal-write }
      - { domainTag: agent-control, riskClass: internal-write }
      - { domainTag: orchestration, riskClass: internal-write }
      - { domainTag: network-fetch, riskClass: external-communication }
      - { domainTag: network-search, riskClass: external-communication }
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        approvalThreshold: destructive
      workspace-write:
        sandbox: workspace-write
        approval: ask
        approvalThreshold: destructive
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        approvalThreshold: safety-critical
