# The dsh-base bundle patch: the shared core of each base-backed profile, applied as
# ONE insert over the empty profile root. Later bundle patches and the user's
# profile cordis.patch.yml address these rows by id, with the last write
# winning per row.
#
# A patch replaces the targeted row's whole `config` rather than merging into
# it, so a row whose value differs by mode does NOT live here: it belongs to
# each mode bundle, keeping any single row down to one bundle layer plus the
# user's. Mode-specific rows appear below only with shared plugin identity and
# neutral defaults; each mode bundle restates its complete configuration.
#
# Row order carries no load semantics (activation is service-availability
# driven); the grouping is for readers.

- insert:
    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'

    # Module reload is opt-in per profile. `patchReload: live` config watching
    # uses the launcher's watch-only fallback and does not require this row.
    - id: hmr
      name: '@deepseek-ai/cordis-plugin-hmr'
      disabled: true
      config:
        root: ['.']

    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: deepseek-llm-api-extensions
      name: '@deepseek-ai/dsh-deepseek-llm-api-extensions'

    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: session-log-deepseek
      name: '@deepseek-ai/dsh-session-log-deepseek'

    - id: typert
      name: '@deepseek-ai/dsh-typert-registry'

    - id: typert-loader
      name: '@deepseek-ai/dsh-typert-loader'

    - id: typert-gateway
      name: '@deepseek-ai/dsh-api-gateway'

    - id: session-title
      name: '@deepseek-ai/dsh-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: session-title-llm
      name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 64
        timeoutMs: 60000

    - id: user-questions
      name: '@deepseek-ai/dsh-user-questions'

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    - id: plugin-package-inventory-deepseek
      name: '@deepseek-ai/dsh-plugin-package-inventory-deepseek'

    # The transport-independent default for Agents created by entry points.
    # Settings may supply a saved selection; consumers read it at creation time.
    - id: agent-default-model
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: deepseek-official
        model: deepseek-v4-flash

    - id: jobs
      name: '@deepseek-ai/dsh-jobs-local'

    # P4-11: one retry budget per RUN, shared by every layer that retries, and
    # one circuit breaker per model endpoint. Both are `ctx.get` consumers, so
    # a profile that omits them keeps the pre-P4-11 behaviour — which is why
    # mounting them HERE is the difference between the epic existing and the
    # epic happening on a `dsh` a user starts.
    - id: run-retry-usage
      name: '@deepseek-ai/dsh-retry/usage'
      config:
        # Ten redone attempts across every layer, for one run. Chosen as the
        # point where a run is clearly looping rather than meeting a rough
        # patch: llm-retry's own per-request policy already caps a single
        # request's attempts far below this, so the run budget binds only when
        # several requests each retry.
        maxRetries: 10
        # Five minutes of WAITING per run. A budget on attempts alone lets a
        # run spend an hour in backoff and still look thrifty; this is the
        # bound an operator actually feels.
        maxDelayBudgetMs: 300000

    - id: circuit-breaker
      name: '@deepseek-ai/dsh-retry-cockatiel'
      config:
        # cockatiel's own ConsecutiveBreaker default is 5, and nothing in this
        # deployment argues for a different one: below it a transient blip
        # opens an endpoint that is fine, above it a dead endpoint keeps being
        # called. Measured against llm-retry's per-request cap, five
        # consecutive COUNTED failures means at least two failed requests.
        consecutiveFailures: 5
        # Thirty seconds before a half-open probe, matching cockatiel's own
        # default: long enough that a restarting endpoint is not hammered,
        # short enough that a recovered one is not written off for a turn.
        openMs: 30000

    - id: llm-retry
      name: '@deepseek-ai/dsh-llm-retry'

    # User-settings document (`$DSH_HOME/settings.yaml`, hot-reloaded): a
    # `llm-deepseek:` or `llm-pi-ai:` section there overrides the adapter entries
    # below without a restart, and is what the web Models page writes.
    - id: settings
      name: '@deepseek-ai/dsh-settings-file'

    # Credential sources: inherited environment over the managed
    # `$DSH_HOME/.credentials.yaml`, with project and user `.env` fallbacks.
    # Adapters resolve references per request; the Models page writes only the
    # managed document, which is never materialized into the process environment.
    - id: credentials
      name: '@deepseek-ai/dsh-credentials-local'

    # The pi-ai multi-provider twin, mounted dormant: zero routes (and no extra
    # models in the picker) until a `llm-pi-ai:` settings section supplies provider
    # profiles — then those routes register live, keys resolving per request
    # through their apiKeyEnv references, and drop again when the section empties.
    # Supplying those profiles is exactly what the web Models page does. Which
    # adapters exist is composition; which providers run is the user's settings
    # document.
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'

    - id: session-persistence-jsonl
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')

    # Durable image bytes live outside the append-only session log. Messages
    # keep content-addressed references that this shared backend resolves for
    # provider requests and authorized history reads.
    - id: attachment-local
      name: '@deepseek-ai/dsh-attachment-local'

    # Full-text session search is opt-in. `openAt: never` keeps
    # ctx.sessionQuery mounted — exact reads, titles, and lineage traces
    # (session export, subagent-fork Workspace inheritance) stay available —
    # while search calls fail with SESSION_QUERY_SEARCH_DISABLED and SQLite is
    # never opened; the Web sidebar search matches titles and workspace names
    # only. Deployments enabling content search override `openAt` to
    # `first-search` or `startup` in a later patch layer (profile
    # cordis.patch.yml or a --patch overlay), typically with a durable `path`.
    - id: session-query-sqlite
      name: '@deepseek-ai/dsh-session-query-sqlite'
      config:
        path: ':memory:'
        openAt: never

    # Shared projection registry: subagent catalog identity (mode/label) folds
    # through its registered units, so the `list_agents` surface below fails
    # loud without it; web layers reuse this same mount for list rows.
    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'

    # Durable KV storage: the storage hub, the json backend, and the
    # schema-validated domain form over them. Session-layer persistence (the
    # projection cache below; workspace and message-feedback in web layers)
    # routes through this stack, so it belongs to the shared base.
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    # Persisted projection cache: throttled write-behind over the
    # session_projcache domain (per-record layout — one version-stamped
    # checkpoint document per session), serving the session listing's
    # projection column.
    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    # Session telemetry defaults to feedback-gated sharing: FEEDBACK_ONLY
    # uploads only when the user records /feedback, releasing the session
    # records since the last handoff through that event (a resumed session
    # shares only its current lifecycle). DSH_TELEMETRY_MODE overrides to
    # FULL or DISABLED; uploading mirrors session-log records onto OTLP/HTTP
    # logs with no session-telemetry/record redaction rule, so exports are
    # the raw captured copy. The deployment stance, env seams, and follow-ups
    # are pinned in the feedback-gated-default Agent Note.
    # DSH_TELEMETRY_OTLP_URL overrides the production endpoint. A non-empty
    # DSH_TELEMETRY_DISABLED — any value, including '0'/'false' — opts the
    # process out (the launchers patch the row disabled; config cannot disable
    # a row). Exports carry the harness home's anonymous user id ($DSH_HOME/.anonymous-user-id,
    # random UUID; delete the file to reset the identity) as the Resource's
    # user.id. The exporter/processor values normally bound the shutdown drain
    # to ~1s against an unreachable collector: exporter.timeoutMillis is both
    # the per-attempt socket timeout and the retry deadline (1s effectively
    # disables the SDK's 5-try backoff), while maxExportBatchSize == maxQueueSize
    # (both explicit) makes the drain a single batch. The SDK awaits
    # exporter.forceFlush() outside exportTimeoutMillis, so the backend's 3s
    # shutdownTimeoutMillis is the load-bearing outer bound when a transport
    # promise never settles. Every CLI exit path drains it by disposing the root
    # on SIGINT/SIGTERM.
    - id: session-telemetry-otel
      name: '@deepseek-ai/dsh-session-telemetry-otel'
      config:
        mode: !!js process.env.DSH_TELEMETRY_MODE || 'FEEDBACK_ONLY'
        shutdownTimeoutMillis: 3000
        exporter:
          url: !!js process.env.DSH_TELEMETRY_OTLP_URL ?? 'https://harness-telemetry.deepseeksvc.com/v1/logs'
          compression: gzip
          timeoutMillis: 1000
        processor:
          scheduledDelayMillis: 10000
          maxQueueSize: 2048
          maxExportBatchSize: 2048
          exportTimeoutMillis: 1500

    - id: subprocess
      name: '@deepseek-ai/dsh-subprocess-local'

    # Every shipped CLI mode starts with the same file-effect boundary.
    # The environment remains an explicit deployment override; otherwise fresh
    # sessions pin workspace-write + ask through the permission service below.
    - id: sandbox
      name: '@deepseek-ai/dsh-sandbox-local'

    - id: sandbox-policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
        workspaceRoot: !!js process.cwd()

    - id: bash-sandbox
      name: '@deepseek-ai/dsh-bash-sandbox'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000

    - id: pwsh-sandbox
      name: '@deepseek-ai/dsh-pwsh-sandbox'
      disabled: !!js process.platform !== 'win32'

    - id: approval
      name: '@deepseek-ai/dsh-user-approval'
      config:
        policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

    # P2-05: the policy engine the enforcement point queries. The enforcement
    # point is already wired into both dispatch paths, and it FAILS CLOSED —
    # with no engine mounted, `decisionWhenUnavailable` denies every action
    # with `policy-unavailable`, which is what made every tool call on a
    # factory profile fail (BLOCKED-187). Mounting a provider is what turns
    # the decision from "nobody answered" into an answer.
    - id: policy-engine
      name: '@deepseek-ai/dsh-policy-engine-cedar'
      config:
        policies:
          # Cedar denies when NO permit matches (`no-matching-permit`), so an
          # empty policy set is not "no policy" — it is a refusal of
          # everything. A deployment that wants a boundary narrows from here
          # by adding `forbid`, which overrides any permit.
          baseline-permit: 'permit(principal, action, resource);'
          # The kernel hard-deny band, stated as a policy now that it can be.
          # `riskClass` was outside the domain of every field Cedar received
          # until BLOCKED-201: the request carried the manifest's
          # `sideEffectClass` (`read | write | network | process |
          # destructive`) and no `RiskClass` at all, so `safety-critical` was
          # unmatchable here and this row held a paragraph explaining why
          # instead of a rule. Both dispatch paths now classify before asking,
          # so the fact arrives and the rule is writable (BLOCKED-187's
          # residual, closed).
          #
          # It is a SECOND refusal of the same band, deliberately: `gateActionRisk`
          # refuses `classification.hardDenied` one layer earlier and still
          # does. They cannot drift, because both read the one classification
          # this dispatch computed — and the policy layer having its own say is
          # what makes the audit record name the band as a policy decision
          # rather than only as a gate that happened first.
          kernel-hard-deny: 'forbid(principal, action, resource) when { context.riskClass == "safety-critical" };'

    - id: permission
      name: '@deepseek-ai/dsh-permission-presets'
      config:
        # P2-04 must[1]: the organisation decides what a declared tag costs.
        # A plugin declares tags and never a class, so this table is the only
        # place a risk band is assigned. A tag no rule names contributes
        # nothing, and an action whose tags are all unnamed falls to the
        # unknown default — the highest policy-adjustable class.
        riskRules:
          # Reads change nothing.
          - { domainTag: filesystem-read, riskClass: read }
          - { domainTag: catalog-read, riskClass: read }
          - { domainTag: session-state-read, riskClass: read }
          - { domainTag: process-observe, riskClass: read }
          # Effects the actor can undo alone, inside its own session.
          - { domainTag: session-state-write, riskClass: local-reversible }
          - { domainTag: context-inject, riskClass: local-reversible }
          # Durable state inside the trust boundary. The SANDBOX is the file
          # boundary's enforcer, so writing and running commands inside it are
          # one trust domain; a sandbox escape is a separate question and
          # already goes through approval.
          - { domainTag: filesystem-write, riskClass: internal-write }
          - { domainTag: shell-execute, riskClass: internal-write }
          - { domainTag: process-control, riskClass: internal-write }
          - { domainTag: agent-spawn, riskClass: internal-write }
          - { domainTag: agent-control, riskClass: internal-write }
          - { domainTag: orchestration, riskClass: internal-write }
          # Leaves the trust boundary.
          - { domainTag: network-fetch, riskClass: external-communication }
          - { domainTag: network-search, riskClass: external-communication }
        presets:
          read-only:
            sandbox: read-only
            approval: ask
            # P2-04: the risk class at or above which an action needs approval.
            # It rides the PRESET, not the surface: which band is worth
            # interrupting for is the same question the preset already answers
            # with `approval`, and a per-surface value would let one client ask
            # about an action another performs silently.
            approvalThreshold: destructive
          workspace-write:
            sandbox: workspace-write
            approval: ask
            approvalThreshold: destructive
          danger-full-access:
            sandbox: danger-full-access
            approval: never
            # The preset whose whole point is not to ask gates only what the
            # kernel refuses outright, which no policy may switch off.
            approvalThreshold: safety-critical

    - id: shell-env
      name: '@deepseek-ai/dsh-shell-env'

    - id: tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
      disabled: !!js process.platform === 'win32'

    - id: tool-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh'
      disabled: !!js process.platform !== 'win32'

    - id: tool-jobs
      name: '@deepseek-ai/dsh-tool-jobs'

    - id: fs-observation-policy
      name: '@deepseek-ai/dsh-fs-observation-policy'

    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'

    - id: tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    # Epic P1-07's project trust boundary. Disabled HERE and enabled by the
    # app bundles that can ask (BLOCKED-214): `acp-app` and `web-app` override
    # this row to `disabled: false`.
    #
    # The split is measured, not cautious. `askForReadTrustOnce` puts its
    # first-time authorization through `approval.request()`, which returns
    # `'unavailable'` when no answerer is registered -- and the only two
    # production answerers are `@deepseek-ai/dsh-acp` and
    # `@deepseek-ai/dsh-ui-approval`. On `headless`, `sdk-app` and
    # `sdk-minimal` nothing answers, so an enabled provider there would refuse
    # every project's own AGENTS.md and skills permanently, with no in-session
    # way to grant. `/trust-skills` is not an escape: it reaches the same
    # absent answerer.
    #
    # A deployment on one of those profiles can still enable this row and add
    # `grants` to turn the boundary on without asking -- see
    # @deepseek-ai/dsh-workspace-trust-local's README.
    - id: workspace-trust-local
      name: '@deepseek-ai/dsh-workspace-trust-local'
      disabled: true

    # `/trust-skills`: the host user's own way to raise this workspace to
    # `trusted-execute`. Enabled, unlike the provider above, and harmless
    # without it — with no `workspaceTrust` mounted the command reports that
    # there is no boundary to raise rather than doing anything. It ships on so
    # that turning the provider on does not also require finding and adding a
    # second row: a boundary whose only ON switch is undiscoverable is one
    # nobody turns on (P1-07 must[2]).
    - id: command-workspace-trust
      name: '@deepseek-ai/dsh-command-workspace-trust'

    - id: agent-instructions
      name: '@deepseek-ai/dsh-agent-instructions'
      config:
        maxBytes: 65536

    # Durable cross-session memory (P6-01): the provider-neutral seam and its
    # recall consumer. Both are disabled by default, matching `hmr` above.
    # `dsh-memory` registers no provider on its own, so an enabled row here
    # would leave every `pnpm dsh` boot with a `ctx.memory` that fails
    # `MEMORY_PROVIDER_UNAVAILABLE` on each pre-step; a profile opts in by
    # enabling both rows and naming a provider directory.
    - id: memory
      name: '@deepseek-ai/dsh-memory'
      disabled: true

    - id: memory-context
      name: '@deepseek-ai/dsh-memory-context'
      disabled: true

    - id: skill
      name: '@deepseek-ai/dsh-skill'

    - id: skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'

    - id: skill-badge
      name: '@deepseek-ai/dsh-skill-badge'
      disabled: true

    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'

    - id: commands
      name: '@deepseek-ai/dsh-commands'

    - id: command-feedback
      name: '@deepseek-ai/dsh-command-feedback'

    - id: goal
      name: '@deepseek-ai/dsh-goal'

    - id: goal-round-driver
      name: '@deepseek-ai/dsh-goal-round-driver'

    - id: command-goal
      name: '@deepseek-ai/dsh-command-goal'

    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    # Human `/compact`: one useful reduction below the automatic threshold. Backend
    # independent, so it follows whichever compaction service this leaf mounts.
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    # P4-06's durable bus. Under the same storage root as the lease store and
    # the taskboard, and for the same reason: two hosts hand messages to each
    # other only when a profile pointed them at one `bus.sqlite`. The store is
    # mounted here; nothing schedules delivery yet, so a row it holds waits for
    # a dispatcher rather than being lost.
    - id: message-bus
      name: '@deepseek-ai/dsh-message-bus'
      config:
        directory: !!js dshHomePath('bus')

    - id: subagent
      name: '@deepseek-ai/dsh-subagent'

    - id: subagent-spawn-in-process
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: subagent-fork-in-process
      name: '@deepseek-ai/dsh-subagent-fork-in-process'
      config:
        providerName: fork

    # Continuable background children are selected per delegation tool. The
    # separately loaded follow-up tool registers the one global `send_message`.
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This base row
    # stays one-shot; preset layers may select continuable mode without adding a
    # child-only system-prompt section or tool schema ahead of that history.
    # See .agents/notes/implemented/feature/2026-08-18-model-selected-subagent-routes.md
    # and .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: one-shot

    # The engine and the Run Service both inject `leaseStore`, so a provider
    # must be mounted or neither activates.
    #
    # The directory follows the SESSION storage root (§12.21): a lease's scope
    # is its work item's scope, and runs and sessions both live under that
    # root. A path relative to the launch directory would let two cwds under
    # one session root hold separate lease databases — two masters over the
    # same run, which is the state this capability exists to prevent.
    # The idempotency ledger the native tool dispatch reserves against before
    # it runs an external effect (P4-12 must[4]). Under the same storage root as
    # the lease store and for the same reason: two hosts that must not both
    # perform one effect have to be pointed at one ledger.
    - id: action-ledger
      name: '@deepseek-ai/dsh-action-ledger'
      config:
        directory: !!js dshHomePath('action-ledger')

    - id: lease-store
      name: '@deepseek-ai/dsh-lease-sqlite'
      config:
        directory: !!js dshHomePath('leases')

    # P2-02's Capability Tokens, mounted because the mechanism had none of its
    # own reach: the definition, the attenuation and `assertTokenPresented`
    # were all complete and tested while nothing issued a token and nothing
    # armed the requirement, so must[1] and must[3] had no subject on any
    # launched profile and the sign-off was withdrawn (§12.69). This row is
    # what makes them have one. `requireForTools` is true here so a tool call
    # must present the session's token; a composition that has not attached
    # tokens to its own tool path can still mount the provider with it false
    # and get issuance and audit without enforcement.
    #
    # Mounted exactly when a trust root exists, because a capability token is a
    # SIGNED object: with no signature roots this provider cannot issue one and
    # throws at apply, taking the whole profile down.
    #
    # Bound to the KERNEL rather than to an env var. Keying it on
    # `DSH_TRUST_KERNEL_INSECURE` was measured wrong: six compositions in this
    # tree inherit `base`, pin no kernel and set no opt-in — the P0-01/P0-07/
    # P1-07/P8-01 composition fixtures and the two release specs — so the env
    # condition covered none of them and P1-07's frozen fixture failed to boot
    # at all. The condition that matters is whether a signature root is present,
    # which is exactly what this asks.
    #
    # This is not skipping a missing referent quietly: a boot with no kernel
    # already announces itself (`enforceTrustKernelPosture` refuses a production
    # boot outright and prints a permanent warning for a development one), and a
    # gate that cannot sign is not a weaker gate but an absent one.
    - id: capability-tokens
      name: '@deepseek-ai/dsh-capability-token-file'
      disabled: !!js ctx.get('trustKernel') === undefined
      config:
        directory: !!js dshHomePath('capability-tokens')
        requireForTools: true

    # P5-11's board, and the producer that puts anything on it. Under the same
    # storage root as the lease store and for the same reason: two hosts that
    # must not both drive one delegated child have to be pointed at one board.
    - id: task-store
      name: '@deepseek-ai/dsh-taskboard-sqlite'
      config:
        directory: !!js dshHomePath('taskboard')

    # The claim lease outlives an ordinary delegated child by a wide margin: a
    # claim that lapses while its child is still running would show a live task
    # as reclaimable, which is the wrong error to make when nothing enforces
    # the claim anyway.
    - id: subagent-taskboard
      name: '@deepseek-ai/dsh-subagent-taskboard'
      config:
        claimLeaseMs: 3600000

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: timeout-policy
      name: '@deepseek-ai/dsh-tool-call-timeout-policy'

    # Boot-time preflight (P0-01 MUST clause): aborts startup when the
    # checkout has drifted from its captured `pnpm baseline:capture`
    # fingerprint. A checkout with no captured baseline (an end-user project,
    # most test fixtures) has nothing to verify and boots unaffected.
    #
    # Disabled by default, matching `hmr` above: opt-in per profile, not a
    # shared-base default. This repo's own committed `.dsh/baseline.json`
    # (the C-stage specimen, pinned to an early gitSha) permanently trails
    # real HEAD, so an unconditional row here would abort every `pnpm dsh`
    # invocation from this checkout's own root — contradicting P0-01's own
    # non-goal ("不冻结上游开发" — this does not freeze upstream development).
    # A profile that wants the gate enables this row and supplies
    # `config.repoRoot` explicitly.
    - id: baseline-preflight
      name: '@deepseek-ai/dsh-baseline-preflight'
      disabled: true

    # First-class Run Service (P4-01): opens a durable Run for every agent
    # session the harness starts, owned by the service itself rather than by
    # a UI session or turn holder, and keeps its append-only event log at
    # `config.storePath`.
    #
    # ENABLED, and the path is derived rather than left to each profile
    # (§12.20-1). It was disabled on the argument that `storePath` "names a
    # real write target with no neutral value" — but `session-persistence-jsonl`
    # and `storage-json` above derive exactly such targets from
    # `dshHomePath`, and so does the lease store below, so the same argument
    # reached two conclusions. The measured cost of the old one: with `run`
    # off on every shipped bundle, no launched profile opened a Run, so
    # `Agent.runLease` was undefined everywhere, tool dispatch presented no
    # fencing token, and P4-07's refusal path had callers that nothing
    # reached.
    - id: run
      name: '@deepseek-ai/dsh-run'
      config:
        storePath: !!js dshHomePath('runs', 'runs.json')

    # P2-12's control plane: the emergency stop every worker consults before it
    # takes new work, and the host-side registry of questions waiting for a
    # human. Mounted HERE rather than only where a question can be answered,
    # and the reason is acceptance[3]: a stop is a cross-surface invariant, so
    # mounting it only on `web` would leave `acp`, `headless` and `sdk`
    # permanently unable to see one, and "every surface agrees" would hold only
    # because three of them never hear anything.
    #
    # The QUESTION half is narrower by nature and that asymmetry is deliberate:
    # `web` is the only shipped profile with a question answerer
    # (`ui-user-questions`), `acp` answers approvals only, and `sdk-minimal`
    # does not layer this bundle at all. On a profile with no answerer `ask`
    # fails closed through the `no-answerer` refusal `dsh-user-questions`
    # already reports, which is a readable refusal rather than a hang.
    - id: control-plane
      name: '@deepseek-ai/dsh-control-plane/plugin'
      config:
        storePath: !!js dshHomePath('control')

    - id: spill-local
      name: '@deepseek-ai/dsh-spill-local'

    - id: spill-policy
      name: '@deepseek-ai/dsh-spill-policy'
      config:
        maxInlineBytes: 50000

    # Durability checkpoints before each model request and top-level dispatch.
    - id: session-checkpoint-policy
      name: '@deepseek-ai/dsh-session-checkpoint-policy'

    # Compacts oversized tool results before the broader conversation compactor
    # runs, preserving the model-visible result within the configured budget.
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

    - id: tool-todo
      name: '@deepseek-ai/dsh-tool-todo'
      config:
        allowParallelInProgress: true

    # Persisted same-session goals reach the model and the slash menu here; the
    # domain, driver, and `/goal` command are above.
    - id: tool-goal
      name: '@deepseek-ai/dsh-tool-goal'

    # Fresh-agent Ralph iteration over a build-time-fixed script.
    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

    - id: tool-str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

    # Consecutive-repeat reminders on the tool chain.
    - id: repeat-tool-reminder
      name: '@deepseek-ai/dsh-repeat-tool-reminder'
      config:
        thresholds: [3, 5, 8]
        argumentsPreviewChars: 500

    # The shared base enables the stable model-facing web_search and web_fetch
    # tools. The Web app disables this host row and composes both tools per agent
    # preset; products with a stricter network policy override tool-web. DeepSeek
    # search resolves the same DEEPSEEK_API_KEY
    # credential the Models page manages for chat, at each search; its Messages
    # endpoint is separate from the chat-completions endpoint, so it takes its own
    # base-URL override. Anonymous fetch accepts only public HTTP(S) destinations,
    # resolves and validates every destination, and pins every actual connection.
    # Search is a full auxiliary model request with server-side retrieval, so this
    # shipped DeepSeek route gets 60s while the provider-neutral tool default
    # remains 30s.
    - id: web
      name: '@deepseek-ai/dsh-web'
      config:
        searchProvider: deepseek-official
        fetchProvider: http

    - id: web-search-deepseek
      name: '@deepseek-ai/dsh-web-search-deepseek'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY

    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'

    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
      config:
        fetch: true
        searchTimeoutMs: 60000

    # ── rows every mode mounts, whose values each overlay may state ──────────────

    # The tool registry. Presentation mode is a deployment choice; omitting it here
    # keeps the schema default (native).
    - id: tools
      name: '@deepseek-ai/dsh-tools'

    # The deployment persona is a deployment choice; plan-mode and tool plugins own
    # their own prompt sections.
    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        persona: ''

    # Agents created at startup. The base stays empty; raw overlays may create
    # agents, while Web creates sessions on client request.
    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []

    # The sandboxed filesystem provider. `cwd` defaults to `process.cwd()`; an
    # overlay can pin another workspace.
    - id: fs-sandbox
      name: '@deepseek-ai/dsh-fs-sandbox'

    # The native DeepSeek adapter. No key or endpoint is inlined: both resolve per
    # request from the `llm-deepseek:` settings section over this entry, with the
    # key coming from the credential store below. Thinking defaults are a deployment
    # choice.
    - id: llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek'
