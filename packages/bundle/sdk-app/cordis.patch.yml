# The SDK application over dsh-base. Stdout belongs exclusively to JSON-RPC.

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

# Turns on the project-trust boundary: an ungranted workspace's own AGENTS.md
# and skills no longer load. This profile has no IN-SESSION way to grant one:
# nothing here answers an approval request. The launch flag does reach the
# plugin -- `command-workspace-trust` is mounted by dsh-base and the `dsh`
# launcher provides the inner argv on every profile -- so `dsh --profile sdk
# --trust-workspace=read` writes a record for the working directory it starts
# in. A deployment granting directories it chooses, rather than the one it
# launches from, still does so before launch with a `--patch` overlay or its
# `$DSH_HOME/cordis.patch.yml`, setting `config.grants` on this same row. The
# row's own config shape is in @deepseek-ai/dsh-workspace-trust-local's README,
# under "Turn the boundary on".
- id: workspace-trust-local
  disabled: false

- insert:
    - id: sdk-app-startup
      name: '@deepseek-ai/dsh-sdk-app'
      config:
        profile: sdk

    - id: sdk-jsonrpc-server
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"
- id: permission
  config:
    riskRules:
      - { domainTag: filesystem-read, riskClass: read }
      - { domainTag: catalog-read, riskClass: read }
      - { domainTag: session-state-read, riskClass: read }
      - { domainTag: process-observe, riskClass: read }
      - { domainTag: session-state-write, riskClass: local-reversible }
      - { domainTag: context-inject, riskClass: local-reversible }
      - { domainTag: filesystem-write, riskClass: internal-write }
      - { domainTag: shell-execute, riskClass: local-reversible }
      - { domainTag: process-control, riskClass: internal-write }
      - { domainTag: agent-spawn, riskClass: internal-write }
      - { domainTag: agent-control, riskClass: internal-write }
      - { domainTag: orchestration, riskClass: internal-write }
      - { domainTag: network-fetch, riskClass: external-communication }
      - { domainTag: network-search, riskClass: external-communication }
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        approvalThreshold: destructive
      workspace-write:
        sandbox: workspace-write
        approval: ask
        approvalThreshold: destructive
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        approvalThreshold: safety-critical
