# The automation-only ACP application over dsh-base. Stdout belongs to ACP.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: session-title-llm
  disabled: true

# P1-07's project trust boundary, ENABLED here and not in `dsh-base`
# (BLOCKED-214). The boundary is only deliverable on a profile that can ASK:
# `askForReadTrustOnce` puts its one question through `approval.request()`, and
# with no registered answerer that call returns `'unavailable'`, which leaves
# the workspace untrusted with no in-session way to grant. This profile mounts
# `@deepseek-ai/dsh-acp`, which answers `approval/request`, so the first-time
# authorization the ruling asks for can actually be put and granted here.
- id: workspace-trust-local
  disabled: false

- insert:
    - id: acp-app-startup
      name: '@deepseek-ai/dsh-acp-app'

    - id: acp
      name: '@deepseek-ai/dsh-acp'
      inject: [acpAppStartup]
      config:
        provider: deepseek-official
        model: deepseek-v4-flash
