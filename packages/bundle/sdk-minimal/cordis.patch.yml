# Standalone minimal SDK application. Unlike the ordinary SDK profile, this
# bundle does not layer over dsh-base: this insert is the complete Cordis tree.
# User profile, home, and invocation patches still apply above it.
#
# No workspace-trust boundary. `@deepseek-ai/dsh-workspace-trust-local` is not
# in this tree, so `ctx.get('workspaceTrust')` is undefined and the facts every
# dispatched tool call hands the enforcement point carry the fail-closed value
# `workspaceTrust: 'untrusted'` (`@deepseek-ai/dsh-tools`'s
# `readPolicyContextFacts`, reached from the agent loop on every call). Nothing
# here loads project content either: the two consumers that boundary gates,
# `@deepseek-ai/dsh-agent-instructions` and `@deepseek-ai/dsh-skill-filesystem`,
# are both absent, so this profile reads no project `AGENTS.md` and no project
# skills.
#
# The shipped bundles that enable the boundary are `acp-app`, `web-app`,
# `headless` and `sdk-app`, each overriding the row `base` ships as
# `disabled: true`. Adding it here is four rows, not one: the provider injects
# `storageDomain`, so its durable record needs the `storage` / `storage-json` /
# `storage-domain` stack (`packages/bundle/base/cordis.patch.yml:174-189`)
# beside the provider's own row. With no answerer mounted, an enabled provider
# refuses every workspace unless the row also carries `grants`; that form is in
# @deepseek-ai/dsh-workspace-trust-local's README.

- insert:
    - id: sdk-app-startup
      name: '@deepseek-ai/dsh-sdk-app'
      config:
        profile: sdk-minimal

    - id: sdk-jsonrpc-server
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: false

    - id: deepseek-llm-api-extensions
      name: '@deepseek-ai/dsh-deepseek-llm-api-extensions'

    - id: session-log-deepseek
      name: '@deepseek-ai/dsh-session-log-deepseek'

    - id: plugin-package-inventory-deepseek
      name: '@deepseek-ai/dsh-plugin-package-inventory-deepseek'

    - id: llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
        defaultContextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)
        streamIdleTimeoutMs: 172800000

    - id: sandbox
      name: '@deepseek-ai/dsh-sandbox-local'

    # Shared projection registry: sandbox-policy and terminal-bash fold
    # sandbox-mode state through its units and require it as a hard injection.
    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'

    - id: sandbox-policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: danger-full-access
        workspaceRoot: !!js process.cwd()

    # P2-05 / BLOCKED-266: the policy chain, so a tool call on this profile
    # meets a DECISION instead of a silence.
    #
    # The enforcement point is already wired into both dispatch paths and fails
    # closed: with no engine mounted, `decisionWhenUnavailable` denies every
    # action `policy-unavailable` (`policy-enforcement/src/index.ts:169-175`,
    # and it is a function, not a Config field, so no bundle can opt out of it).
    # That is why every tool call on this profile was refused while its README
    # promised the opposite. Mounting a provider is what turns "nobody
    # answered" into an answer.
    #
    # **Three rows, not the four `base` carries, and the missing one is load
    # bearing.** `@deepseek-ai/dsh-permission-presets` THROWS at start when the
    # composed shell does not confine (`permission-presets/src/index.ts:259-261`),
    # `ShellService.sandboxMode` is `undefined` on the base class
    # (`shell/shell/src/index.ts:74-76`) and only `bash-sandbox` overrides it,
    # and this profile mounts neither — its shell rows are `dsh-terminal` and
    # `dsh-terminal-bash`. Copying `base`'s chain wholesale would turn a profile
    # that refuses every tool call into one that does not boot.
    #
    # **What that costs, stated rather than discovered later.** With no risk
    # table, nothing classifies, and every action reaches the engine as
    # `security-sensitive` — the fail-closed default at
    # `core/tools/src/external-effect.ts:245` — whatever domain tags it
    # declares. `kernel-hard-deny` forbids `safety-critical` alone, so the band
    # below it is admitted by the baseline permit and the decision is real.
    # Mounting the table here needs a confining shell first, which is a change
    # to what this profile promises and not part of this one.
    - id: settings
      name: '@deepseek-ai/dsh-settings-file'

    # Required, not optional: `PolicySetProvider` declares
    # `static readonly inject = ['settings']` and its own doc says why — without
    # a settings provider it registers no namespace, states no policy set, and
    # enforces nothing, silently.
    #
    # The three policies are this profile's BASE layer, resolving below the
    # user's `settings.yaml` `policy-set:` section, so a deployment that never
    # edits its settings document still enforces them and one that names an id
    # overrides that policy alone.
    - id: policy-language
      name: '@deepseek-ai/dsh-policy-language'
      config:
        policies:
          # Cedar denies when NO permit matches, so an empty policy set is not
          # "no policy" — it is a refusal of everything. Copied from `base`
          # unchanged: a second spelling of the same baseline would be a second
          # answer to what this harness permits by default.
          baseline-permit: 'permit(principal, action, resource);'
          # The kernel hard-deny band, also from `base` unchanged.
          kernel-hard-deny: 'forbid(principal, action, resource) when { context.riskClass == "safety-critical" };'
          # This profile's own permit, and the point of the whole change: the
          # README promises an unconfined shell here, and that promise is now a
          # policy with an id an operator can read, override or narrow —
          # instead of a refusal that contradicted it. Naming it separately
          # from `baseline-permit` is deliberate: an audit record that cites
          # THIS id says the action was permitted because this profile says so,
          # not because nothing objected.
          sdk-minimal-danger-full-access: 'permit(principal, action, resource);'

    # The engine takes no configuration: it asks `ctx.policySet` for the set in
    # force on every decision, and the pin it records comes from that same read.
    - id: policy-engine
      name: '@deepseek-ai/dsh-policy-engine-cedar'

    - id: subprocess
      name: '@deepseek-ai/dsh-subprocess-local'

    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: terminal-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    # Keep the minimal agent kernel explicit: unlike dsh-base, this profile
    # owns each service row and omits every optional producer it does not use.
    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'

    # Plugin warnings and errors on stderr, prefixed `dsh: ` (BLOCKED-336). Without
    # it they stay in Cordis's in-memory buffer, which no operator reads. It never
    # writes stdout, where results and protocol frames go.
    - id: logger-stderr
      name: '@deepseek-ai/dsh-logger-stderr'

    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: session-title
      name: '@deepseek-ai/dsh-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        personaPrefix: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a helpful software engineer assistant.'

    - id: tools
      name: '@deepseek-ai/dsh-tools'

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    - id: llm-retry
      name: '@deepseek-ai/dsh-llm-retry'

    - id: jobs
      name: '@deepseek-ai/dsh-jobs-local'

    - id: invariants
      name: '@deepseek-ai/dsh-invariants'

    - id: session-invariant
      name: '@deepseek-ai/dsh-session/invariant'

    - id: agent-invariant
      name: '@deepseek-ai/dsh-agent/invariant'

    - id: scope-invariant
      name: '@deepseek-ai/dsh-scope/invariant'

    - id: agent-loop-invariant
      name: '@deepseek-ai/dsh-agent-loop/invariant'

    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * Network access depends on the task environment. Prefer configured mirrors/proxies when they are available.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

    - id: persistent-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a PowerShell shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * State is persistent across command calls and discussions with the user.
          * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell, not bash.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.

    - id: sessions
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')
        compression: none
