# Minimal Provider-stage composition for Epic P2-10: a real settings provider
# reading a real document, and the policy namespace registered over it. No
# bundle layer and no engine — the shipped mount and the enforcement point are
# the Usage stage's, and mounting either here would prove them early against a
# composition this fixture built for itself.
- id: settings
  name: '@deepseek-ai/dsh-settings-file'
  config:
    path: './settings.yaml'
    watch: true
    debounceMs: 20

- id: policy-language
  name: '@deepseek-ai/dsh-policy-language'
  config:
    maxPolicies: 3
    maxSourceBytes: 1024
    # The shipped baseline, standing in for what `bundle/base` supplies: a
    # deployment that never edits its document still enforces these, and one
    # that names the same id overrides just that policy.
    policies:
      shipped-forbid: 'forbid(principal, action, resource) when { context.riskClass == "safety-critical" };'
