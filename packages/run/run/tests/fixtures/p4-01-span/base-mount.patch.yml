# Test-only overlay over the SHIPPED headless profile for P4-01 acceptance[2]
# (K1, K2). The production bundle layers own the Run Service, the lease store,
# the subagent service and its in-process `spawn` provider; this overlay adds
# none of them. It supplies only a keyless model, a readable session log, and
# a stable session id for the root agent, so a restart continues its Run.
- id: typert-loader
  disabled: true

- id: typert-gateway
  disabled: true

- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        sessionId: p4-01-span-parent
        provider: p4-01-mock
        model: p4-01-mock
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: p4-01-mock-llm
      name: './mock-llm.ts'
